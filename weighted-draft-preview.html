<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EllenG draft balance preview</title><link rel="stylesheet" href="style.css"><style>body{padding:20px;max-width:900px;margin:auto}.teams{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}button:disabled{opacity:.4}.card{margin-top:15px}select{max-width:100%}#message{line-height:1.5}@media(max-width:500px){.teams{grid-template-columns:1fr}}</style></head><body><h1>EllenG draft balance preview</h1><p>This uses sample golfers only. It does not change your tournament.</p><label>Sample player mix <select id="mix"><option value="ABBBCCDD">One A captain</option><option value="AABBCCDD">Two A golfers</option><option value="BBBBCCDD">No A golfers</option><option value="ABBBBCCDD">Odd golfer count</option></select></label> <button id="reset">Reset sample</button><p id="message" role="status"></p><div id="teams" class="teams"></div><div class="card"><h2>Available golfers</h2><div id="pool"></div></div><script src="weighted-draft.js"></script><script>
let sample;const names=['Aaron (sample captain)','Carl (sample captain)'];function reset(){const mix=document.getElementById('mix').value;sample={teams:names.map(captain=>({captain,roster:[]})),golfers:[...mix].map((band,i)=>({name:i<2?names[i]:'Sample golfer '+(i+1),band,self_ranked:true,team:null})),picks:[],draftType:'snake',timerPaused:true};sample=EllenGWeightedDraft.prepare(sample);render();}function render(){const options=EllenGWeightedDraft.options(sample),n=sample.picks.length,done=n===sample.golfers.length,t=Math.floor(n/2)%2?1-n%2:n%2;document.getElementById('message').textContent=done?'Draft complete. Teams have the best attainable balance under the band model.':names[t]+' picks next. Unavailable choices would make the final team balance worse.';document.getElementById('teams').innerHTML=sample.teams.map((team,i)=>'<div class="card"><h2>Team '+(i+1)+'</h2>'+team.roster.map(index=>'<p>'+sample.golfers[index].name+' — '+sample.golfers[index].band+'</p>').join('')+'</div>').join('');document.getElementById('pool').innerHTML=sample.golfers.map((g,i)=>g.team==null?'<div class="choice"><strong>'+g.name+'</strong><span>'+g.band+'</span><button data-index="'+i+'" '+(!options.eligible[t].includes(g.band)?'disabled':'')+'>Draft</button></div>':'').join('')||'<p>All golfers assigned.</p>';document.querySelectorAll('[data-index]').forEach(button=>button.onclick=()=>{const i=Number(button.dataset.index);sample.golfers[i].team=t;sample.teams[t].roster.push(i);sample.picks.push({golfer:i,team:t});render();});}document.getElementById('reset').onclick=reset;document.getElementById('mix').onchange=reset;reset();</script></body></html>
