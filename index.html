<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EllenG Cup Live Draft</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top"><img src="gator.jpeg"><div><h1>EllenG Cup — Live Draft</h1><div>Official Live Draft Board</div></div><div style="margin-left:auto" id="connection">CONNECTING</div></div>
<div class="wrap"><div class="card"><div class="bar"><div><strong id="onclock">Loading draft…</strong><div id="meta" class="muted"></div></div><div style="text-align:center"><div id="clock">1:00</div><div class="muted">LIVE PICK CLOCK</div></div></div></div><div id="teams" class="teams"></div><div class="card" style="margin-top:12px"><h3>Draft Log</h3><div id="log" class="muted"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
function render(){let done=S.picks.length>=24,t=order(S.picks.length);document.getElementById("onclock").textContent=done?"DRAFT COMPLETE":"ON THE CLOCK: "+S.teams[t].name;document.getElementById("meta").textContent=done?"All 24 golfers drafted":`Round ${Math.floor(S.picks.length/6)+1} • Pick ${S.picks.length+1} of 24`;document.getElementById("teams").innerHTML=S.teams.map((tm,i)=>`<div class="team"><div class="teamhead"><strong>${esc(tm.name)}</strong><div class="muted" style="color:#ddd">${tm.captain?"Captain: "+esc(tm.captain):""}</div><div style="font-size:11px">${bands.map(b=>b+" "+tbc(i,b)).join(" • ")}</div></div><div class="roster">${Array.from({length:4},(_,j)=>{let g=S.golfers[tm.roster[j]];return g?`<div class="slot"><strong>${esc(g.name)}</strong> <span class="badge">${g.band}</span><div class="muted">HCP ${esc(g.hcp||"—")}</div></div>`:`<div class="slot muted">Open roster spot</div>`}).join("")}</div></div>`).join("");document.getElementById("log").innerHTML=S.picks.length?S.picks.map((p,i)=>`${i+1}. ${esc(S.teams[p.team].name)} — ${esc(S.golfers[p.golfer].name)} (${S.golfers[p.golfer].band})`).join("<br>"):"Waiting for the first pick.";draw()}
function draw(){let x=remaining();document.getElementById("clock").textContent=Math.floor(x/60)+":"+String(x%60).padStart(2,"0");document.getElementById("clock").style.color=x<=10?"#9b2f2f":""}
(async()=>{try{await load();render();subscribe(render);setInterval(draw,500)}catch(e){document.getElementById("onclock").textContent="Supabase is not connected yet."}})();
</script></body></html>
