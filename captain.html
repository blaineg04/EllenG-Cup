<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EllenG Cup Captain Draft</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top"><img src="gator.jpeg"><div><h1>EllenG Cup — Captain Draft</h1><div>Live Team Selection</div></div><div style="margin-left:auto" id="connection">CONNECTING</div></div>
<div class="wrap"><div id="login" class="card"><h2>Captain Sign In</h2><div class="actions" style="justify-content:flex-start"><input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button id="signin" class="gold">Sign In</button></div><div id="msg" class="muted"></div></div>
<div id="app" style="display:none"><div class="card"><div class="bar"><div><strong id="onclock"></strong><div id="meta" class="muted"></div></div><div style="text-align:center"><div id="clock">1:00</div><div id="clocktxt" class="muted">LIVE PICK CLOCK</div></div></div><div id="notice" class="muted"></div></div>
<div class="grid"><div class="card"><h2>Available Golfers</h2><div id="pool"></div></div><div class="card"><h2>Live Rosters</h2><div id="teams" class="teams"></div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
let myTeam=null;
async function whoami(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from("elleng_captains").select("team_index").eq("draft_id",cfg.draftId).eq("user_id",user.id).single();if(error){document.getElementById("msg").textContent="This account is not assigned to a team.";return false}myTeam=data.team_index;return true}
function render(){let done=S.picks.length>=24,t=order(S.picks.length),mine=t===myTeam&&!done;document.getElementById("onclock").textContent=done?"DRAFT COMPLETE":"ON THE CLOCK: "+S.teams[t].name;document.getElementById("meta").textContent=done?"All rosters complete":`Round ${Math.floor(S.picks.length/6)+1} • Pick ${S.picks.length+1}`;document.getElementById("notice").textContent=done?"":mine?"YOUR PICK — select an eligible golfer below.":"Waiting for "+S.teams[t].name+" to pick…";document.getElementById("pool").innerHTML=S.golfers.map((g,i)=>({...g,i})).filter(g=>g.name&&g.team==null).map(g=>{let ok=mine&&canBand(t,g.band);return `<div class="player"><strong>${esc(g.name)}</strong><span class="badge">${g.band}</span><span class="muted">${bandRange(g.band)}</span><button data-p="${g.i}" ${ok?"":"disabled"}>${mine?(ok?"DRAFT":"Band Limit"):"Waiting"}</button></div>`}).join("");document.getElementById("teams").innerHTML=S.teams.map((tm,i)=>`<div class="team"><div class="teamhead"><strong>${esc(tm.name)}</strong>${i===myTeam?" • YOUR TEAM":""}<div class="muted" style="color:#ddd">${esc(tm.captain||"")}</div><div style="font-size:11px">${bands.map(b=>b+" "+tbc(i,b)).join(" • ")}</div></div><div class="roster">${Array.from({length:4},(_,j)=>{let g=S.golfers[tm.roster[j]];return g?`<div class="slot"><strong>${esc(g.name)}</strong> <span class="badge">${g.band}</span><div class="muted">${bandRange(g.band)}</div></div>`:`<div class="slot muted">Open roster spot</div>`}).join("")}</div></div>`).join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>pick(+b.dataset.p));draw()}
function draw(){let x=remaining();document.getElementById("clock").textContent=Math.floor(x/60)+":"+String(x%60).padStart(2,"0");document.getElementById("clock").style.color=x<=10?"#9b2f2f":""}
async function pick(i){await load();let t=order(S.picks.length);if(t!==myTeam){render();return}let g=S.golfers[i];if(!g||g.team!=null||!canBand(t,g.band))return;g.team=t;S.teams[t].roster.push(i);S.picks.push({golfer:i,team:t});S.timerPaused=false;S.timerEndsAt=new Date(Date.now()+S.timerLength*1000).toISOString();try{await save();render()}catch(e){alert("Pick could not be saved. Refresh and try again.")}}
document.getElementById("signin").onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("pw").value});if(error){document.getElementById("msg").textContent=error.message;return}if(await whoami()){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";await load();render();subscribe(render);setInterval(draw,500)}};
(async()=>{const {data:{session}}=await db.auth.getSession();if(session&&await whoami()){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";await load();render();subscribe(render);setInterval(draw,500)}})();
</script></body></html>
