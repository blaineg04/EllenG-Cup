<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EllenG Cup Captain Draft</title><link rel="stylesheet" href="style.css"><style>
.top{background:linear-gradient(90deg,#08253b 0%,#08253b 68%,#0b304b 100%)!important;color:white!important;padding:14px 16px!important;border-bottom:4px solid #d5a72c!important;overflow:hidden!important;display:block!important}
.brand{max-width:1100px;margin:auto;display:flex;align-items:center;gap:18px;min-height:92px;position:relative}
.brand img{width:150px!important;height:92px!important;object-fit:contain!important;object-position:left center!important;border:0!important;border-radius:0!important;background:transparent!important;padding:0!important;box-shadow:none!important;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22))!important;flex:0 0 auto}
.brand h1{margin:0;font-size:27px;line-height:1.05}.brand p{margin:6px 0 0;opacity:.86;font-size:13px;letter-spacing:.02em}
@media(max-width:560px){.top{padding:10px 10px 11px!important}.brand{gap:10px;min-height:76px}.brand img{width:112px!important;height:76px!important}.brand h1{font-size:22px}}

}

.main-menu-bar{
  position:sticky;top:0;z-index:9999;background:#f3f6f7;padding:8px 12px;
  border-bottom:1px solid #d9e1e5;display:flex;justify-content:flex-start
}
.main-menu-link{
  display:inline-flex;align-items:center;background:#08253b;color:#fff!important;
  border:2px solid #d5a72c;border-radius:999px;padding:9px 13px;font-weight:900;
  text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.12)
}
@media(max-width:560px){.main-menu-bar{padding:7px 9px}.main-menu-link{padding:8px 11px;font-size:12px}}
</style></head><body><div class="main-menu-bar">
  <a class="main-menu-link" href="./scoring.html#hub">← Main Menu</a>
</div>
<header class="top"><div class="brand"><img src="gator.png" alt="EllenG Cup gator logo"><div><h1>EllenG Cup</h1><p>CAPTAIN DRAFT • LIVE TEAM SELECTION</p></div><div style="margin-left:auto" id="connection">CONNECTING</div></div></header>
<div class="wrap"><div id="login" class="card"><h2>Captain Sign In</h2><div class="actions" style="justify-content:flex-start"><input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button id="signin" class="gold">Sign In</button></div><div id="msg" class="muted"></div></div>
<div id="app" style="display:none"><div class="card" style="margin-bottom:12px"><button id="soundToggle" class="gold">🔊 Enable Draft Sounds</button><span id="soundStatus" class="muted" style="margin-left:10px">Sound off</span></div><div class="card"><div class="bar"><div><strong id="onclock"></strong><div id="meta" class="muted"></div></div><div style="text-align:center"><div id="clock">1:00</div><div id="clocktxt" class="muted">LIVE PICK CLOCK</div></div></div><div id="notice" class="muted"></div></div>
<div class="grid"><div class="card"><h2>Available Golfers</h2><div id="pool"></div></div><div class="card"><h2>Live Rosters</h2><div id="teams" class="teams"></div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
let myTeam=null;
async function whoami(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from("elleng_captains").select("team_index,captain_name,captain_email").eq("draft_id",cfg.draftId).eq("user_id",user.id).single();if(error){document.getElementById("msg").textContent="This account is not assigned to a team. Ask the commissioner to assign your captain account.";return false}myTeam=Number(data.team_index);return true}
let draftSoundEnabled=false,lastSoundPickCount=null,audioCtx=null;
async function enableDraftSound(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")await audioCtx.resume();draftSoundEnabled=!draftSoundEnabled;document.getElementById("soundToggle").textContent=draftSoundEnabled?"🔇 Mute Draft Sounds":"🔊 Enable Draft Sounds";document.getElementById("soundStatus").textContent=draftSoundEnabled?"Sound ON — test growl played":"Sound off";if(draftSoundEnabled){gatorGrowl(true);setTimeout(()=>{if(draftSoundEnabled)document.getElementById("soundStatus").textContent="Gator sound ON"},1400)}}catch(e){draftSoundEnabled=false;document.getElementById("soundStatus").textContent="Audio blocked — tap again"}}
function gatorGrowl(force=false){if((!draftSoundEnabled&&!force)||!audioCtx)return;try{let now=audioCtx.currentTime,dur=1.25,osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter(),lfo=audioCtx.createOscillator(),lfoGain=audioCtx.createGain();osc.type="sawtooth";osc.frequency.setValueAtTime(92,now);osc.frequency.exponentialRampToValueAtTime(48,now+dur);filter.type="lowpass";filter.frequency.setValueAtTime(520,now);filter.Q.value=7;lfo.type="sine";lfo.frequency.value=18;lfoGain.gain.value=15;lfo.connect(lfoGain);lfoGain.connect(osc.frequency);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.32,now+.08);gain.gain.setValueAtTime(.32,now+.55);gain.gain.exponentialRampToValueAtTime(.0001,now+dur);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(now);lfo.start(now);osc.stop(now+dur);lfo.stop(now+dur)}catch(e){}}
function checkDraftSound(){let n=S.picks.length;if(lastSoundPickCount===null){lastSoundPickCount=n;return}if(n>lastSoundPickCount)gatorGrowl();lastSoundPickCount=n}
function render(){checkDraftSound();let total=totalPicks(),done=S.picks.length>=total,t=done?0:order(S.picks.length),mine=!done&&t===myTeam&&!S.timerPaused;document.getElementById("onclock").textContent=done?"DRAFT COMPLETE":"ON THE CLOCK: "+(S.teams[t]?.name||"Team");document.getElementById("meta").textContent=done?`All ${total} golfers drafted`:`${S.teams.length} teams • ${total} golfers • Round ${Math.floor(S.picks.length/S.teams.length)+1} • Pick ${S.picks.length+1} of ${total}`;document.getElementById("notice").textContent=done?"":S.timerPaused?"Draft is paused. Waiting for the Commissioner to start or resume.":mine?"YOUR PICK — select an eligible golfer below.":"Waiting for "+(S.teams[t]?.name||"Team")+" to pick…";document.getElementById("pool").innerHTML=S.golfers.map((g,i)=>({...g,i})).filter(g=>g.name&&g.team==null).map(g=>{let ok=mine&&canBand(t,g.band);return `<div class="player"><strong>${esc(g.name)}</strong><span class="badge">${g.band}</span><span class="muted">${bandRange(g.band)}</span><button data-p="${g.i}" ${ok?"":"disabled"}>${mine?(ok?"DRAFT":"Band Limit"):"Waiting"}</button></div>`}).join("")||'<div class="muted">No available golfers.</div>';document.getElementById("teams").innerHTML=S.teams.map((tm,i)=>`<div class="team"><div class="teamhead"><strong>${esc(tm.name)}</strong>${i===myTeam?" • YOUR TEAM":""}<div class="muted" style="color:#ddd">${esc(tm.captain||"")}</div><div style="font-size:11px">${bands.map(b=>b+" "+tbc(i,b)).join(" • ")}</div></div><div class="roster">${Array.from({length:teamCapacity(i)},(_,j)=>{let g=S.golfers[tm.roster[j]];return g?`<div class="slot"><strong>${esc(g.name)}</strong> <span class="badge">${g.band}</span><div class="muted">${bandRange(g.band)}</div></div>`:`<div class="slot muted">Open roster spot</div>`}).join("")}</div></div>`).join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>pick(+b.dataset.p));draw()}
function draw(){let x=remaining();document.getElementById("clock").textContent=Math.floor(x/60)+":"+String(x%60).padStart(2,"0");document.getElementById("clock").style.color=x<=10?"#9b2f2f":""}
async function pick(i){if(S.timerPaused){alert("The draft is paused. Wait for the Commissioner to start or resume it.");return}if(!confirm("Draft "+(S.golfers[i]?.name||"this golfer")+" for "+(S.teams[myTeam]?.name||"your team")+"?"))return;try{const {data,error}=await db.rpc("elleng_make_pick",{p_draft_id:cfg.draftId,p_golfer_index:i});if(error)throw error;S={...fresh(),...data};if(draftSoundEnabled){gatorGrowl();lastSoundPickCount=S.picks.length}render()}catch(e){await load();render();alert(e.message||"Pick could not be saved. Refresh and try again.")}}
document.getElementById("signin").onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("pw").value});if(error){document.getElementById("msg").textContent=error.message;return}if(await whoami()){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";await load();render();subscribe(render);setInterval(draw,500)}};
document.getElementById("soundToggle").onclick=enableDraftSound;
(async()=>{
  try{
    const {data:{user}}=await db.auth.getUser();
    if(user && await whoami()){
      document.getElementById("login").style.display="none";
      document.getElementById("app").style.display="block";
      await load();render();subscribe(render);setInterval(draw,500);
    }else{
      document.getElementById("login").style.display="block";
      document.getElementById("app").style.display="none";
      if(user)document.getElementById("msg").textContent="This signed-in account is not assigned as a captain for this tournament.";
    }
  }catch(e){
    document.getElementById("login").style.display="block";
    document.getElementById("app").style.display="none";
  }
})();
</script></body></html>
