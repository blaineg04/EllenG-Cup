<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EllenG Cup — 2v2 Setup Preview</title>
<style>
:root{font-family:system-ui,sans-serif;color:#08253b;background:#f5f7f8}body{margin:0;padding:20px}.panel{max-width:620px;margin:auto;background:white;border:1px solid #dce3e7;border-radius:16px;padding:20px}h1{margin-top:0}label{display:block;font-weight:650;margin:16px 0 6px}select,button{font:inherit;width:100%;padding:12px;border-radius:9px;border:1px solid #aebfc9;background:white}button{background:#08253b;color:white;margin-top:18px;cursor:pointer}.hint{color:#667782;font-size:.9rem}.match{padding:12px;border:1px solid #dce3e7;border-radius:9px;margin-top:10px}.error{color:#a22}
</style>
</head>
<body>
<main class="panel">
<h1>EllenG Cup — 2v2 Preview</h1>
<p class="hint">Commissioner planning preview only. No live tournament changes are saved.</p>
<label for="format">Playing format</label>
<select id="format">
<option value="scramble">2-Man Scramble</option>
<option value="best_ball">2-Man Best Ball</option>
<option value="shamble">2-Man Shamble</option>
<option value="split_nine">EllenG Split Nine</option>
</select>
<label for="players">Total golfers (equal teams)</label>
<select id="players">
<option value="4">4 golfers — 1 match</option>
<option value="8">8 golfers — 2 matches</option>
<option value="12">12 golfers — 3 matches</option>
<option value="16">16 golfers — 4 matches</option>
<option value="20">20 golfers — 5 matches</option>
<option value="24">24 golfers — 6 matches</option>
<option value="32">32 golfers — 8 matches</option>
<option value="40">40 golfers — 10 matches</option>
</select>
<button id="preview" type="button">Preview pairings</button>
<section id="results" aria-live="polite"></section>
</main>
<script src="./two-v-two.js"></script>
<script>
document.getElementById('preview').addEventListener('click',()=>{
 const total=Number(document.getElementById('players').value);
 const format=document.getElementById('format').value;
 const perTeam=total/2;
 const make=(prefix)=>Array.from({length:perTeam},(_,i)=>({id:prefix+' '+(i+1)}));
 const result=window.EllenGTwoVsTwo.planPairings(make('Team A Player'),make('Team B Player'),format);
 const out=document.getElementById('results');
 out.replaceChildren();
 const heading=document.createElement('h2');
 heading.textContent=result.ok?result.matches.length+' head-to-head matches':result.error;
 out.append(heading);
 if(!result.ok){heading.className='error';return;}
 for(const match of result.matches){
   const div=document.createElement('div');
   div.className='match';
   div.textContent='Match '+match.match+': '+match.teamA.join(' & ')+' vs '+match.teamB.join(' & ');
   out.append(div);
 }
});
</script>
</body>
</html>
