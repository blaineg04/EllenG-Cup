name: Local Supabase compatibility
on:
  push:
    branches: ['release/nov20-score-integrity-20261020']
    paths: ['.github/workflows/local-supabase-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    if: github.ref == 'refs/heads/release/nov20-score-integrity-20261020'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 8
    steps:
      - name: Check native runtime requirements without installing services
        shell: bash
        run: |
          set -euo pipefail
          architecture="$(uname -m)"
          macos_version="$(sw_vers -productVersion)"
          apple_silicon="$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)"
          translated="$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)"
          printf 'Apple silicon support: %s\\nRosetta translation: %s\\n' "$apple_silicon" "$translated"
          printf 'Architecture: %s\nmacOS: %s\n' "$architecture" "$macos_version"
          if [ "$apple_silicon" = "1" ] && [ "${macos_version%%.*}" -ge 14 ]; then
            echo "Native platform requirement: PASS"
          else
            echo "Native platform requirement: UNSUPPORTED"
          fi
          if command -v supabase >/dev/null 2>&1; then
            supabase --version
            supabase --help
          else
            echo "Supabase CLI: not installed on PATH"
          fi
          node --version
          npm --version
      - name: Check Docker and available local runtime tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          if [ -d /Applications/Docker.app ]; then
            echo "Docker Desktop: installed"
          else
            echo "Docker Desktop: not installed"
          fi
          if command -v docker >/dev/null 2>&1; then
            docker --version
            if docker info --format '{{.ServerVersion}}' 2>/dev/null; then
              echo "Docker engine: ready"
            else
              echo "Docker engine: not reachable"
            fi
          else
            echo "Docker CLI: not installed on PATH"
          fi
          for tool in brew colima podman; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%s: installed\\n' "$tool"
            else
              printf '%s: absent\\n' "$tool"
            fi
          done
          df -h / | tail -1
      - name: Start installed Docker Desktop and check engine resources
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          docker desktop --help
          if ! docker info --format '{{.ServerVersion}}' >/dev/null 2>&1; then
            docker desktop start --help
            docker desktop start
          fi
          docker info --format 'Engine {{.ServerVersion}}; CPUs {{.NCPU}}; memory bytes {{.MemTotal}}'
          docker system df
