name: MacBook approved EllenG production release
on:
  push:
    branches: ['release/macbook-approved-3b46216']
    paths: ['.github/workflows/macbook-approved-production.yml']
permissions:
  contents: read
jobs:
  cleanup-task-build:
    if: github.repository == 'blaineg04/EllenG-Cup' && github.ref == 'refs/heads/release/macbook-approved-3b46216'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 3
    steps:
      - name: Clean only this release attempt's temporary files
        shell: bash
        run: |
          set -euo pipefail
          mount_dir="$RUNNER_TEMP/elleng-approved-mount-41891532300"
          image="$RUNNER_TEMP/elleng-approved-41891532300.dmg"
          cli_dir="$RUNNER_TEMP/elleng-vercel-cli-41891532300"
          if mount | grep -F " on $mount_dir " >/dev/null; then
            hdiutil detach -quiet "$mount_dir" || hdiutil detach -quiet -force "$mount_dir"
          fi
          if test -f "$image"; then rm -f "$image"; fi
          if test -d "$cli_dir"; then rm -rf "$cli_dir"; fi
          if test -d "$mount_dir"; then rmdir "$mount_dir"; fi
          echo "Temporary release volume and CLI cleaned; awaiting MacBook Vercel sign-in." >> "$GITHUB_STEP_SUMMARY"
