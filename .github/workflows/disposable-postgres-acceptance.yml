name: Disposable PostgreSQL acceptance contract
on:
  push:
    branches: ['development/disposable-postgres-acceptance-20261022', 'release-candidate/nov20-app-only-20261022', 'development/nov20-release-reconciliation-20261026']
    paths: ['tests/disposable-postgres-contract.sql', 'tests/disposable-draft-concurrency.sql', 'tests/disposable-draft-order.sql', 'tests/disposable-realtime-publication.sql', 'tests/disposable-realtime-migration.sql', 'tests/disposable-realtime-negative.sql', 'tests/actual-commissioner-rpc.sql', 'tests/actual-captain-rpc.sql', 'tests/scoring-branch-compatibility.test.cjs', 'tests/acceptance/authorized-shamble-rpc-proposal.sql', 'tests/acceptance/disposable-split-pair-atomic.sql', 'db/patches/**', 'tests/acceptance/authorized-shamble-proposal.test.cjs', 'tests/acceptance/score-policy-readonly-audit.sql', 'docs/proposed-scoring-rls-hardening-20261027.sql', 'tests/acceptance/disposable-scoring-rls-roles.sql', 'tests/acceptance/disposable-event-rsvp-schema.sql', 'docs/proposed-event-rsvp-schema-20261027.sql', 'docs/proposed-event-rsvp-commissioner-approval-rpc-20261027.sql', 'docs/proposed-realtime-publication-migration.sql', 'tests/reference-schema-security.test.cjs', 'tests/realtime-client-reconnect.test.cjs', 'tests/draft-reconnect.test.cjs', 'tests/captain-pick-inflight.test.cjs', 'tests/draft-subscribe-behavior.test.cjs', 'tests/draft-timer-behavior.test.cjs', 'tests/draft-two-client-simulation.test.cjs', 'common.js', 'captain.html', 'scoring.html', 'event-rsvp-eligibility.js', 'event-rsvp-client.js', 'tests/acceptance/event-rsvp-client.test.cjs', 'event-rsvp-rollout.js', 'tests/acceptance/event-rsvp-rollout.test.cjs', 'tests/acceptance/event-rsvp-eligibility.test.cjs', 'supabase.sql', '.github/workflows/disposable-postgres-acceptance.yml']
  pull_request:
    paths: ['tests/disposable-postgres-contract.sql', 'tests/disposable-draft-concurrency.sql', 'tests/disposable-draft-order.sql', 'tests/disposable-realtime-publication.sql', 'tests/disposable-realtime-migration.sql', 'tests/disposable-realtime-negative.sql', 'tests/actual-commissioner-rpc.sql', 'tests/actual-captain-rpc.sql', 'tests/scoring-branch-compatibility.test.cjs', 'tests/acceptance/authorized-shamble-rpc-proposal.sql', 'tests/acceptance/disposable-split-pair-atomic.sql', 'db/patches/**', 'tests/acceptance/authorized-shamble-proposal.test.cjs', 'tests/acceptance/score-policy-readonly-audit.sql', 'docs/proposed-scoring-rls-hardening-20261027.sql', 'tests/acceptance/disposable-scoring-rls-roles.sql', 'tests/acceptance/disposable-event-rsvp-schema.sql', 'docs/proposed-event-rsvp-schema-20261027.sql', 'docs/proposed-event-rsvp-commissioner-approval-rpc-20261027.sql', 'docs/proposed-realtime-publication-migration.sql', 'tests/reference-schema-security.test.cjs', 'tests/realtime-client-reconnect.test.cjs', 'tests/draft-reconnect.test.cjs', 'tests/captain-pick-inflight.test.cjs', 'tests/draft-subscribe-behavior.test.cjs', 'tests/draft-timer-behavior.test.cjs', 'tests/draft-two-client-simulation.test.cjs', 'common.js', 'captain.html', 'scoring.html', 'event-rsvp-eligibility.js', 'event-rsvp-client.js', 'tests/acceptance/event-rsvp-client.test.cjs', 'event-rsvp-rollout.js', 'tests/acceptance/event-rsvp-rollout.test.cjs', 'tests/acceptance/event-rsvp-eligibility.test.cjs', 'supabase.sql', '.github/workflows/disposable-postgres-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check reference schema RLS and team-size guardrails
        run: node --test tests/acceptance/event-rsvp-rollout.test.cjs tests/acceptance/event-rsvp-client.test.cjs tests/acceptance/event-rsvp-eligibility.test.cjs tests/reference-schema-security.test.cjs tests/realtime-client-reconnect.test.cjs tests/draft-reconnect.test.cjs tests/captain-pick-inflight.test.cjs tests/draft-subscribe-behavior.test.cjs tests/draft-timer-behavior.test.cjs tests/draft-two-client-simulation.test.cjs
      - name: Run disposable native PostgreSQL contract without Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client >/dev/null
          pg_version="$(ls /etc/postgresql | sort -V | tail -1)"
          sudo pg_ctlcluster "$pg_version" main start || sudo pg_ctlcluster "$pg_version" main status
          db="elleng_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          cleanup() { sudo -u postgres dropdb --if-exists "$db" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_negative" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_captain" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_policy" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_rsvp" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_restore" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_splitpair" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo -u postgres createdb "$db"
          # Event RSVP migration is validated only against an isolated fixture database.
          rsvp_db="${db}_rsvp"
          sudo -u postgres createdb "$rsvp_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$rsvp_db" -f tests/acceptance/disposable-event-rsvp-schema.sql
          sudo -u postgres dropdb "$rsvp_db"
          # Roles are cluster-wide; the isolated RSVP fixture creates Supabase roles.
          # Remove them before the existing policy fixture creates authenticated.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c "drop role if exists anon; drop role if exists authenticated;"
          # Verify the read-only scoring release gate rejects a broad permissive
          # policy and accepts the same status guard when restrictive.
          policy_db="${db}_policy"
          sudo -u postgres createdb "$policy_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$policy_db" -c "create table public.elleng_team_scores(tournament_id text,team_index integer); alter table public.elleng_team_scores enable row level security; create policy \"active live team insert guard\" on public.elleng_team_scores for insert to public with check (team_index >= 0);"
          if sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$policy_db" -f tests/acceptance/score-policy-readonly-audit.sql > /tmp/elleng-policy-"$GITHUB_RUN_ID".log 2>&1; then
            echo 'FAIL: broad permissive score write policy escaped release gate'
            exit 1
          fi
          grep -q 'Scoring RLS release gate failed' /tmp/elleng-policy-"$GITHUB_RUN_ID".log
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$policy_db" -c "drop policy \"active live team insert guard\" on public.elleng_team_scores; create policy \"active live team insert guard\" on public.elleng_team_scores as restrictive for insert to public with check (team_index >= 0);"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$policy_db" -f tests/acceptance/score-policy-readonly-audit.sql
          # Apply the exact proposed migration to disposable schema replicas,
          # then verify every intended guard is restrictive.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$policy_db" -c "create role authenticated nologin; create table public.elleng_tournaments(id text primary key, team_count integer, status text); alter table public.elleng_team_scores add column score integer; create table public.elleng_player_hole_scores(tournament_id text,team_index integer); create table public.elleng_pair_hole_scores(tournament_id text,team_index integer); alter table public.elleng_player_hole_scores enable row level security; alter table public.elleng_pair_hole_scores enable row level security;"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$policy_db" -f docs/proposed-scoring-rls-hardening-20261027.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$policy_db" -f tests/acceptance/score-policy-readonly-audit.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$policy_db" -f tests/acceptance/disposable-scoring-rls-roles.sql
          test "$(sudo -u postgres psql -X -At -d "$policy_db" -c "select count(*) from pg_policies where schemaname='public' and tablename in ('elleng_team_scores','elleng_player_hole_scores','elleng_pair_hole_scores') and policyname like 'active live % guard' and permissive='RESTRICTIVE';")" = 9
          sudo -u postgres dropdb "$policy_db"
          rm -f /tmp/elleng-policy-"$GITHUB_RUN_ID".log
          echo 'PASS: scoring RLS gate rejects permissive guard and accepts restrictive guard.'
          # Exercise the staged Shamble RPC and invalid-hole case inside a rolled-back disposable fixture.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -f tests/acceptance/authorized-shamble-fixture.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -f tests/disposable-postgres-contract.sql
          # Rehearse a database backup and restore using only disposable CI records.
          # This validates tooling and data recovery without touching hosted Supabase.
          restore_db="${db}_restore"
          sudo -u postgres createdb "$restore_db"
          backup_file="$(sudo -u postgres mktemp /tmp/elleng-ci-backup.XXXXXX)"
          sudo -u postgres pg_dump -Fc -d "$db" -f "$backup_file"
          sudo -u postgres pg_restore --exit-on-error -d "$restore_db" "$backup_file"
          source_tables="$(sudo -u postgres psql -X -At -d "$db" -c "select count(*) from pg_tables where schemaname='acceptance';")"
          restored_tables="$(sudo -u postgres psql -X -At -d "$restore_db" -c "select count(*) from pg_tables where schemaname='acceptance';")"
          test "$source_tables" -gt 0
          test "$source_tables" = "$restored_tables"
          # Compare deterministic catalog metadata; pg_dump text can differ by database name.
          catalog_query="select table_name || ':' || column_name || ':' || data_type || ':' || is_nullable || ':' || coalesce(column_default,'') from information_schema.columns where table_schema='acceptance' order by table_name,ordinal_position;"
          source_columns="$(sudo -u postgres psql -X -At -d "$db" -c "$catalog_query")"
          restored_columns="$(sudo -u postgres psql -X -At -d "$restore_db" -c "$catalog_query")"
          test -n "$source_columns"
          test "$source_columns" = "$restored_columns"
          # Verify actual row data survives, not only schema definitions.
          source_rows="$(sudo -u postgres psql -X -At -d "$db" -c "select count(*) from acceptance.drafts;")"
          restored_rows="$(sudo -u postgres psql -X -At -d "$restore_db" -c "select count(*) from acceptance.drafts;")"
          test "$source_rows" -gt 0
          test "$source_rows" = "$restored_rows"
          # Compare the recovered draft payload and ownership, not merely row counts.
          draft_query="select id || ':' || owner_id::text || ':' || state::text || ':' || updated_at::text from acceptance.drafts order by id;"
          source_drafts="$(sudo -u postgres psql -X -At -d "$db" -c "$draft_query")"
          restored_drafts="$(sudo -u postgres psql -X -At -d "$restore_db" -c "$draft_query")"
          test -n "$source_drafts"
          test "$source_drafts" = "$restored_drafts"
          sudo -u postgres dropdb "$restore_db"
          sudo -u postgres rm -f "$backup_file"
          echo 'PASS: disposable database backup and isolated restore preserved acceptance tables.'
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -f tests/disposable-draft-concurrency.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -f tests/disposable-draft-order.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -f tests/disposable-realtime-publication.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -f tests/disposable-realtime-migration.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -f tests/actual-commissioner-rpc.sql
          # Use a separate isolated database to avoid fixture function/table collisions.
          captain_db="${db}_captain"
          sudo -u postgres createdb "$captain_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$captain_db" -f tests/actual-captain-rpc.sql
          # Exercise the actual RPC with two concurrent transactions, not the simplified model.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$captain_db" -c "insert into public.elleng_drafts(id,owner_id,state) values('race-qa','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa','{\"draftType\":\"snake\",\"draftRules\":\"open\",\"timerPaused\":false,\"timerLength\":60,\"golferCount\":3,\"picks\":[],\"golfers\":[{\"name\":\"A\"},{\"name\":\"B\"},{\"name\":\"C\"}],\"teams\":[{\"roster\":[]},{\"roster\":[]}]}');insert into public.elleng_captains values('race-qa','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb',0),('race-qa','cccccccc-cccc-cccc-cccc-cccccccccccc',1);"
          race_first="$(mktemp)"
          race_second="$(mktemp)"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$captain_db" -c "begin; select set_config('elleng.test_actor','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb',false);select public.elleng_make_pick('race-qa',0);select pg_sleep(2);commit;" > "$race_first" 2>&1 &
          race_pid=$!
          sleep 0.5
          if sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$captain_db" -c "select set_config('elleng.test_actor','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb',false);select public.elleng_make_pick('race-qa',1);" > "$race_second" 2>&1; then
            echo 'FAIL: second same-team draft pick unexpectedly succeeded'
            exit 1
          fi
          wait "$race_pid"
          grep -q "It is not your team's turn" "$race_second"
          test "$(sudo -u postgres psql -X -At -d "$captain_db" -c "select jsonb_array_length(state->'picks') from public.elleng_drafts where id='race-qa';")" = 1
          rm -f "$race_first" "$race_second"
          echo 'PASS: actual captain RPC row lock rejects concurrent second same-team pick.'
          sudo -u postgres dropdb "$captain_db"
          # The exact proposed migration must fail when score-table RLS is off.
          # Use another disposable DB so this cannot affect the positive cases.
          neg_db="${db}_negative"
          sudo -u postgres createdb "$neg_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$neg_db" -c "create table public.elleng_player_hole_scores(id int);create table public.elleng_pair_hole_scores(id int);alter table public.elleng_player_hole_scores enable row level security;create publication supabase_realtime for table public.elleng_player_hole_scores;"
          if sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$neg_db" -f tests/disposable-realtime-negative.sql > /tmp/elleng-negative-"$GITHUB_RUN_ID".log 2>&1; then
            echo 'FAIL: migration accepted score table without RLS'
            exit 1
          fi
          grep -q 'Missing RLS-enabled source table: elleng_pair_hole_scores' /tmp/elleng-negative-"$GITHUB_RUN_ID".log
          test "$(sudo -u postgres psql -X -At -d "$neg_db" -c "select count(*) from pg_publication_tables where pubname='supabase_realtime' and tablename='elleng_pair_hole_scores';")" = 0
          sudo -u postgres dropdb "$neg_db"
          rm -f /tmp/elleng-negative-"$GITHUB_RUN_ID".log
          echo 'PASS: actual migration rejected RLS-disabled table without publishing it.'
          # Separate concurrent database sessions compete for the same pick.
          # The delayed winner holds a row lock; the second caller must not duplicate it.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -At -d "$db" -c "select acceptance.try_pick('disposable-only',7,0,2);" > /tmp/elleng-first-"$GITHUB_RUN_ID" &
          first_pid=$!
          sleep 0.4
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -At -d "$db" -c "select acceptance.try_pick('disposable-only',7,0);" > /tmp/elleng-second-"$GITHUB_RUN_ID" &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
          first_result="$(cat /tmp/elleng-first-"$GITHUB_RUN_ID")"
          second_result="$(cat /tmp/elleng-second-"$GITHUB_RUN_ID")"
          test "$first_result" = accepted
          test "$second_result" = wrong_turn
          count="$(sudo -u postgres psql -X -At -d "$db" -c "select count(*) from acceptance.picks where draft_id='disposable-only' and golfer=7;")"
          test "$count" = 1
          # Advance the turn legitimately, then retry the original golfer when Team 0 is on clock again.
          # This verifies duplicate rejection independently of the wrong-turn check.
          next_pick="$(sudo -u postgres psql -X -At -d "$db" -c "select acceptance.try_pick('disposable-only',8,1);")"
          test "$next_pick" = accepted
          duplicate_result="$(sudo -u postgres psql -X -At -d "$db" -c "select acceptance.try_pick('disposable-only',7,0);")"
          test "$duplicate_result" = already_picked
          count="$(sudo -u postgres psql -X -At -d "$db" -c "select count(*) from acceptance.picks where draft_id='disposable-only';")"
          test "$count" = 2
          echo 'PASS: attempted re-pick rejected after turn cycles back.'
          # The next team must retain its turn when a duplicate is rejected.
          current_turn="$(sudo -u postgres psql -X -At -d "$db" -c "select current_team from acceptance.turns where draft_id='disposable-only';")"
          test "$current_turn" = 0
          pick_count="$(sudo -u postgres psql -X -At -d "$db" -c "select count(*) from acceptance.picks where draft_id='disposable-only';")"
          test "$pick_count" = 2
          third_pick="$(sudo -u postgres psql -X -At -d "$db" -c "select acceptance.try_pick('disposable-only',9,0);")"
          test "$third_pick" = accepted
          current_turn="$(sudo -u postgres psql -X -At -d "$db" -c "select current_team from acceptance.turns where draft_id='disposable-only';")"
          test "$current_turn" = 1
          echo 'PASS: rejected duplicate preserves turn; subsequent eligible pick advances it.'
          # Two simultaneous *different* golfers from the same team must not
          # both be accepted for a single turn (a distinct lost-update case).
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -c "insert into acceptance.turns values ('second-race',0);"
          first_file="$(mktemp)"
          second_file="$(mktemp)"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -At -d "$db" -c "select acceptance.try_pick('second-race',21,0,2);" > "$first_file" &
          first_pid=$!
          sleep 0.4
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -At -d "$db" -c "select acceptance.try_pick('second-race',22,0);" > "$second_file" &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
          test "$(cat "$first_file")" = accepted
          test "$(cat "$second_file")" = wrong_turn
          test "$(sudo -u postgres psql -X -At -d "$db" -c "select count(*) from acceptance.picks where draft_id='second-race';")" = 1
          test "$(sudo -u postgres psql -X -At -d "$db" -c "select current_team from acceptance.turns where draft_id='second-race';")" = 1
          rm -f "$first_file" "$second_file"
          echo 'PASS: competing different-golfer submissions cannot consume one team turn twice.'


          rm -f /tmp/elleng-first-"$GITHUB_RUN_ID" /tmp/elleng-second-"$GITHUB_RUN_ID"
          echo 'PASS: one accepted pick, conflicting attempt rejected, one durable row.'
          # Run the exact staged Split-Pair SQL against a disposable native PostgreSQL instance.
          splitpair_db="${db}_splitpair"
          sudo -u postgres createdb "$splitpair_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$splitpair_db" -f tests/acceptance/disposable-split-pair-atomic.sql
          # Two genuine database sessions compete for the same tournament row lock.
          # Hold the first transaction after committing the first pair write, while
          # the second attempts to post the other pair.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$splitpair_db" -c "select set_config('elleng.test_actor','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb',false); delete from public.elleng_pair_hole_scores; delete from public.elleng_team_scores;" >/dev/null
          first_pair="$(mktemp)"
          second_pair="$(mktemp)"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$splitpair_db" -c "begin; select set_config('elleng.test_actor','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb',false); select public.elleng_test_authorized_split_pair('tournament-qa',0,13,0,18); select pg_sleep(2); commit;" > "$first_pair" 2>&1 &
          first_pair_pid=$!
          sleep 0.4
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$splitpair_db" -c "select set_config('elleng.test_actor','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb',false); select public.elleng_test_authorized_split_pair('tournament-qa',0,13,1,19);" > "$second_pair" 2>&1
          wait "$first_pair_pid"
          test "$(sudo -u postgres psql -X -At -d "$splitpair_db" -c "select score from public.elleng_team_scores where tournament_id='tournament-qa' and team_index=0 and hole=13;")" = 37
          test "$(sudo -u postgres psql -X -At -d "$splitpair_db" -c "select count(*) from public.elleng_pair_hole_scores where tournament_id='tournament-qa' and hole=13;")" = 2
          rm -f "$first_pair" "$second_pair"
          echo 'PASS: concurrent independent pair submissions produce one consistent team total.'
          sudo -u postgres dropdb "$splitpair_db"
          echo 'PASS: staged Split-Pair RPC completed, cleared, and denied an unauthorized actor.'
          echo 'Full Supabase Auth/RLS and two-device checks remain pending.'
