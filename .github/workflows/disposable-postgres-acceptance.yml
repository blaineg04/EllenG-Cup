bscribe-behavior.test.cjs', 'tests/draft-timer-behavior.test.cjs', 'tests/draft-two-client-simulation.test.cjs', 'common.js', 'captain.html', 'scoring.html', 'event-rsvp-eligibility.js', 'event-rsvp-client.js', 'tests/acceptance/event-rsvp-client.test.cjs', 'event-rsvp-rollout.js', 'tests/acceptance/event-rsvp-rollout.test.cjs', 'tests/acceptance/event-rsvp-eligibility.test.cjs', 'supabase.sql', '.github/workflows/disposable-postgres-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check reference schema RLS and team-size guardrails
        run: node --test tests/acceptance/event-rsvp-rollout.test.cjs tests/acceptance/event-rsvp-client.test.cjs tests/acceptance/event-rsvp-eligibility.test.cjs tests/reference-schema-security.test.cjs tests/realtime-client-reconnect.test.cjs tests/draft-reconnect.test.cjs tests/captain-pick-inflight.test.cjs tests/draft-subscribe-behavior.test.cjs tests/draft-timer-behavior.test.cjs tests/draft-two-client-simulation.test.cjs
      - name: Verify commissioner authorization and RSVP regressions
        run: node --test tests/commissioner-rsvp-preview.test.cjs
      - name: Check scoring preflight contracts
        run: node --test tests/acceptance/scoring-preflight-contract.test.cjs
      - name: Run disposable native PostgreSQL contract without Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client >/dev/null
          pg_version="$(ls /etc/postgresql | sort -V | tail -1)"
          sudo pg_ctlcluster "$pg_version" main start || sudo pg_ctlcluster "$pg_version" main status
          db="elleng_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          cleanup() { sudo -u postgres dropdb --if-exists "$db" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_negative" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_captain" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_policy" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_shamble_race" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_integrated" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_format_race" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_format" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_shamble_policy" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_rsvp" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_restore" >/dev/null 2>&1 || true; sudo -u postgres dropdb --if-exists "${db}_splitpair" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo -u postgres createdb "$db"
          # Negative strict-mode proof against a new, empty disposable database.
          # Expected failure must be the gate's explicit missing-RPC exception.
          strict_log="$(mktemp)"
          if sudo -u postgres psql -X -v ON_ERROR_STOP=1 -v REQUIRE_SCORING_READY=1 -d "$db" -f tests/acceptance/scoring-deployment-preflight.sql >"$strict_log" 2>&1; then
            cat "$strict_log"
            echo 'FAIL: strict scoring preflight accepted missing RPCs'
            exit 1
          fi
          if ! grep -q 'Scoring rehearsal blocked: required RPC missing' "$strict_log"; then
            cat "$strict_log"
            echo 'FAIL: strict preflight failed for an unexpected reason'
            exit 1
          fi
          rm -f "$strict_log"
          echo 'PASS: strict scoring preflight rejects missing scoring RPCs.'
          # Positive path: disposable schema with both RPC signatures, strict grants,
          # and RLS-enabled score tables. This validates the gate only, not app scoring.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" <<'SQL'
          DO $roles$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
          END $roles$;
          CREATE TABLE public.elleng_pair_hole_scores (id integer);
          CREATE TABLE public.elleng_player_hole_scores (id integer);
          CREATE TABLE public.elleng_team_scores (id integer);
          ALTER TABLE public.elleng_pair_hole_scores ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.elleng_player_hole_scores ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.elleng_team_scores ENABLE ROW LEVEL SECURITY;
          CREATE FUNCTION public.elleng_test_authorized_split_pair(text,integer,integer,integer,integer)
            RETURNS integer LANGUAGE sql AS 'SELECT 1';
          CREATE FUNCTION public.elleng_test_authorized_shamble(text,integer,integer,integer,integer)
            RETURNS integer LANGUAGE sql AS 'SELECT 1';
          CREATE FUNCTION public.elleng_test_authorized_scramble(text,integer,integer,integer)
            RETURNS integer LANGUAGE sql AS 'SELECT 1';
          CREATE FUNCTION public.elleng_test_commissioner_clear_scores(text)
            RETURNS integer LANGUAGE sql AS 'SELECT 1';
          REVOKE ALL ON FUNCTION public.elleng_test_authorized_split_pair(text,integer,integer,integer,integer) FROM PUBLIC,anon;
          REVOKE ALL ON FUNCTION public.elleng_test_authorized_shamble(text,integer,integer,integer,integer) FROM PUBLIC,anon;
          REVOKE ALL ON FUNCTION public.elleng_test_authorized_scramble(text,integer,integer,integer) FROM PUBLIC,anon;
          REVOKE ALL ON FUNCTION public.elleng_test_commissioner_clear_scores(text) FROM PUBLIC,anon;
          GRANT EXECUTE ON FUNCTION public.elleng_test_authorized_split_pair(text,integer,integer,integer,integer) TO authenticated;
          GRANT EXECUTE ON FUNCTION public.elleng_test_authorized_shamble(text,integer,integer,integer,integer) TO authenticated;
          GRANT EXECUTE ON FUNCTION public.elleng_test_authorized_scramble(text,integer,integer,integer) TO authenticated;
          GRANT EXECUTE ON FUNCTION public.elleng_test_commissioner_clear_scores(text) TO authenticated;
          SQL
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -v REQUIRE_SCORING_READY=1 -d "$db" -f tests/acceptance/scoring-deployment-preflight.sql >/dev/null
          echo 'PASS: strict scoring preflight accepts valid disposable RPC grants and RLS.'
          # Remove fixture objects so later cluster-wide role reset is not blocked.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" <<'SQL'
          DROP FUNCTION public.elleng_test_authorized_split_pair(text,integer,integer,integer,integer);
          DROP FUNCTION public.elleng_test_authorized_shamble(text,integer,integer,integer,integer);
          DROP FUNCTION public.elleng_test_authorized_scramble(text,integer,integer,integer);
          DROP FUNCTION public.elleng_test_commissioner_clear_scores(text);
          DROP TABLE public.elleng_pair_hole_scores;
          DROP TABLE public.elleng_team_scores;
          SQL

          # Prove format-scoped scoring ranges in disposable PostgreSQL only.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -f tests/acceptance/disposable-score-format-range-probe.sql
          # Run format-trigger fixture in its own database to prevent table-name collisions.
          format_db="${db}_format"
          sudo -u postgres createdb "$format_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$format_db" -f tests/acceptance/disposable-staged-format-trigger.sql
          sudo -u postgres dropdb "$format_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$db" -f tests/acceptance/disposable-tournament-format-score-guard.sql
          node --test tests/acceptance/shamble-dynamic-draft-policies.test.cjs
          node --test tests/acceptance/integrated-scoring-candidate.test.cjs
          node --test tests/acceptance/commissioner-score-reset-rpc.test.cjs
          # Actually execute the assembled SQL in an isolated PostgreSQL database.
          # The expected final exception is the deliberate deployment stop; any
          # earlier SQL failure must fail CI rather than claiming migration readiness.
          integrated_db="${db}_integrated"
          sudo -u postgres createdb "$integrated_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$integrated_db" -f tests/acceptance/disposable-integrated-migration-schema.sql >/dev/null
          # Fail at fixture setup, not later in migration, if auth.uid is absent.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$integrated_db" -c "
          DO \$auth_fixture_gate\$
          BEGIN
            IF to_regprocedure('auth.uid()') IS NULL THEN
              RAISE EXCEPTION 'Missing auth.uid() in integrated fixture database';
            END IF;
          END \$auth_fixture_gate\$;" >/dev/null
          node scripts/build-scoring-migration-review.cjs --stdout > /tmp/elleng-integrated-"$GITHUB_RUN_ID".sql
          integrated_log="$(mktemp)"
          if sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$integrated_db" -f /tmp/elleng-integrated-"$GITHUB_RUN_ID".sql >"$integrated_log" 2>&1; then
            echo 'FAIL: review-only integrated candidate unexpectedly applied'; exit 1
          fi
          if ! grep -q 'REVIEW-ONLY scoring candidate: direct-DML permissions' "$integrated_log"; then
            cat "$integrated_log"
            echo 'FAIL: integrated candidate failed before its deliberate stop'; exit 1
          fi
          test "$(sudo -u postgres psql -X -At -d "$integrated_db" -c "SELECT count(*) FROM pg_proc WHERE proname IN ('elleng_test_authorized_shamble','elleng_test_authorized_split_pair');")" = 0
          # Negative gate: a production-like authenticated direct-write grant
          # must stop the candidate BEFORE migration DDL is installed.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$integrated_db" -c "GRANT INSERT,UPDATE,DELETE ON public.elleng_team_scores TO authenticated;" >/dev/null
          if sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$integrated_db" -f /tmp/elleng-integrated-"$GITHUB_RUN_ID".sql >"$integrated_log" 2>&1; then
            echo 'FAIL: unsafe direct-write grant did not block migration'; exit 1
          fi
          grep -q 'NO-GO: authenticated direct scoring DML' "$integrated_log"
          test "$(sudo -u postgres psql -X -At -d "$integrated_db" -c "SELECT count(*) FROM pg_proc WHERE proname IN ('elleng_test_authorized_shamble','elleng_test_authorized_split_pair');")" = 0
          # Full coordinated review: install RPCs, triggers and lockdown in one
          # disposable transaction; the explicit final exception must roll it back.
          node scripts/build-scoring-migration-review.cjs --coordinated-review > /tmp/elleng-coordinated-"$GITHUB_RUN_ID".sql
          if sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$integrated_db" -f /tmp/elleng-coordinated-"$GITHUB_RUN_ID".sql >"$integrated_log" 2>&1; then
            echo 'FAIL: coordinated review migration unexpectedly committed'; exit 1
          fi
          if ! grep -q 'REVIEW-ONLY scoring candidate' "$integrated_log"; then
            cat "$integrated_log"
            echo 'FAIL: coordinated review SQL failed before final rollback guard'; exit 1
          fi
          test "$(sudo -u postgres psql -X -At -d "$integrated_db" -c "SELECT count(*) FROM pg_proc WHERE proname IN ('elleng_test_authorized_scramble','elleng_test_authorized_shamble','elleng_test_authorized_split_pair','elleng_test_commissioner_clear_scores');")" = 0
          rm -f /tmp/elleng-coordinated-"$GITHUB_RUN_ID".sql
          # Commit the reviewed coordinated SQL into an isolated database, not hosted Supabase.
          install_db="${db}_install_trial"
          sudo -u postgres createdb "$install_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$install_db" -f tests/acceptance/disposable-integrated-migration-schema.sql >/dev/null
          # Save a pre-install snapshot, then independently restore it into a
          # second disposable database to prove the recovery artifact is readable.
          snapshot="/tmp/elleng-preinstall-$GITHUB_RUN_ID.dump"
          sudo -u postgres pg_dump -Fc -d "$install_db" -f "$snapshot"
          recovery_db="${db}_install_recovery"
          sudo -u postgres createdb "$recovery_db"
          sudo -u postgres pg_restore --exit-on-error -d "$recovery_db" "$snapshot"
          test "$(sudo -u postgres psql -X -At -d "$recovery_db" -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('elleng_team_scores','elleng_pair_hole_scores','elleng_player_hole_scores');")" = 3
          sudo -u postgres dropdb "$recovery_db"
          sudo -u postgres rm -f "$snapshot"
          ELLENG_DISPOSABLE_PG_TEST=I_UNDERSTAND_ISOLATED_ONLY node scripts/build-scoring-migration-review.cjs --coordinated-review --disposable-install > /tmp/elleng-install-"$GITHUB_RUN_ID".sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$install_db" -f /tmp/elleng-install-"$GITHUB_RUN_ID".sql >/dev/null
          test "$(sudo -u postgres psql -X -At -d "$install_db" -c "SELECT count(*) FROM pg_proc WHERE proname IN ('elleng_test_authorized_scramble','elleng_test_authorized_shamble','elleng_test_authorized_split_pair','elleng_test_commissioner_clear_scores');")" = 4
          test "$(sudo -u postgres psql -X -At -d "$install_db" -c "SELECT count(*) FROM pg_trigger WHERE tgname LIKE 'elleng_%' AND NOT tgisinternal;")" -ge 6
          # Post-COMMIT validation of actual installed grants and RLS.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$install_db" -c "
          DO \$postinstall\$
          BEGIN
           IF EXISTS (
            SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public'
             AND c.relname IN ('elleng_team_scores','elleng_pair_hole_scores','elleng_player_hole_scores')
             AND (NOT c.relrowsecurity
               OR has_table_privilege('authenticated',c.oid,'INSERT')
               OR has_table_privilege('authenticated',c.oid,'UPDATE')
               OR has_table_privilege('authenticated',c.oid,'DELETE')
               OR has_table_privilege('anon',c.oid,'INSERT')
               OR has_table_privilege('anon',c.oid,'UPDATE')
               OR has_table_privilege('anon',c.oid,'DELETE'))
           ) THEN RAISE EXCEPTION 'Post-install RLS or ACL failure'; END IF;
          END \$postinstall\$;" >/dev/null
          # Verify all four committed RPCs have authenticated-only execution.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$install_db" -c "
          DO \$rpc_gate\$
          DECLARE n integer;
          BEGIN
           SELECT count(*) INTO n FROM pg_proc p JOIN pg_namespace ns ON ns.oid=p.pronamespace
           WHERE ns.nspname='public'
             AND p.proname IN ('elleng_test_authorized_scramble','elleng_test_authorized_split_pair','elleng_test_authorized_shamble','elleng_test_commissioner_clear_scores')
             AND has_function_privilege('authenticated',p.oid,'EXECUTE')
             AND NOT has_function_privilege('anon',p.oid,'EXECUTE')
             AND NOT EXISTS (SELECT 1 FROM aclexplode(coalesce(p.proacl,acldefault('f',p.proowner))) acl WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE');
           IF n <> 4 THEN RAISE EXCEPTION 'Post-install RPC grants invalid: % of 4',n; END IF;
          END \$rpc_gate\$;" >/dev/null
          # Confirm broad legacy policies are absent after the committed migration.
          test "$(sudo -u postgres psql -X -At -d "$install_db" -c "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename IN ('elleng_team_scores','elleng_pair_hole_scores','elleng_player_hole_scores') AND policyname LIKE 'active live % guard';")" = 0
          # Disposable fixture does not install hosted SELECT grants; grant the
          # hosted-equivalent read baseline before verifying migration preserves it.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$install_db" -c "GRANT SELECT ON public.elleng_team_scores, public.elleng_pair_hole_scores, public.elleng_player_hole_scores TO authenticated;" >/dev/null
          # Confirm authenticated read access remains after write lockdown.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$install_db" -c "
          DO \$read_gate\$
          DECLARE n integer;
          BEGIN
           SELECT count(*) INTO n FROM pg_class c JOIN pg_namespace ns ON ns.oid=c.relnamespace
           WHERE ns.nspname='public'
             AND c.relname IN ('elleng_team_scores','elleng_pair_hole_scores','elleng_player_hole_scores')
             AND has_table_privilege('authenticated',c.oid,'SELECT');
           IF n<>3 THEN RAISE EXCEPTION 'Post-install scoring SELECT access missing: % of 3',n; END IF;
          END \$read_gate\$;" >/dev/null
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$install_db" -f tests/acceptance/disposable-installed-authenticated-scramble.sql >/dev/null
          # Exercise actual PostgreSQL API roles (not only simulated JWT claims).
          # RPCs must reject anon; authenticated may execute but cannot write
          # score tables directly after coordinated privilege lockdown.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$install_db" -c "
          DO \$role_gate\$
          BEGIN
            IF has_function_privilege('anon',
              'public.elleng_test_authorized_scramble(text,integer,integer,integer)', 'EXECUTE')
            THEN RAISE EXCEPTION 'anon can execute scoring RPC'; END IF;
            IF NOT has_function_privilege('authenticated',
              'public.elleng_test_authorized_scramble(text,integer,integer,integer)', 'EXECUTE')
            THEN RAISE EXCEPTION 'authenticated cannot execute scoring RPC'; END IF;
          END \$role_gate\$;" >/dev/null
          # SET ROLE enforces the actual database role; no JWT must fail closed.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$install_db" -c "
          SET ROLE authenticated;
          DO \$role_gate\$
          BEGIN
            BEGIN
              PERFORM public.elleng_test_authorized_scramble('auth-tournament',0,4,5);
              RAISE EXCEPTION 'Authenticated role without JWT was permitted to score';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
          END \$role_gate\$;
          RESET ROLE;" >/dev/null
          sudo -u postgres dropdb "$install_db"
          rm -f /tmp/elleng-install-"$GITHUB_RUN_ID".sql
          echo 'PASS: coordinated migration committed and verified in disposable PostgreSQL.'
          # Validate the coordinated lockdown independently in disposable Postgres.
          # Production-like grants must be revoked for all three score tables.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$integrated_db" -c "GRANT INSERT,UPDATE,DELETE ON public.elleng_pair_hole_scores, public.elleng_player_hole_scores TO authenticated; GRANT INSERT,UPDATE,DELETE ON public.elleng_team_scores TO anon;" >/dev/null
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$integrated_db" -f db/patches/20261029_score_table_dml_lockdown_REVIEW_ONLY.sql >/dev/null
          locked_count="$(sudo -u postgres psql -X -At -d "$integrated_db" -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('elleng_team_scores','elleng_pair_hole_scores','elleng_player_hole_scores') AND (has_table_privilege('authenticated',c.oid,'INSERT,UPDATE,DELETE,TRUNCATE') OR has_table_privilege('anon',c.oid,'INSERT,UPDATE,DELETE,TRUNCATE'));")"
          test "$locked_count" = 0
          if sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$integrated_db" -c "SET ROLE authenticated; INSERT INTO public.elleng_team_scores(tournament_id,team_index,hole,score) VALUES ('test',0,1,4);" >"$integrated_log" 2>&1; then
            echo 'FAIL: authenticated direct team score write succeeded after lockdown'; exit 1
          fi
          grep -q 'permission denied' "$integrated_log"
          echo 'PASS: API score-table grants revoked and direct write denied in disposable Postgres.'
          rm -f "$integrated_log" /tmp/elleng-integrated-"$GITHUB_RUN_ID".sql
          sudo -u postgres dropdb "$integrated_db"
          echo 'PASS: integrated migration executes to deliberate stop and rolls back.'
          # Exercise standard Scramble through the authenticated API role under lockdown.
          scramble_role_db="${db}_scramble_role"
          sudo -u postgres createdb "$scramble_role_db"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$scramble_role_db" -f tests/acceptance/authorized-scramble-restricted-role.sql >/dev/null
          sudo -u postgres dropdb "$scramble_role_db"
          echo 'PASS: authorized Scramble survives direct-DML lockdown.'
