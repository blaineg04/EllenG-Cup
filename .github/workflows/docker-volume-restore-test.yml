name: Verify archived database restores
on:
  push:
    branches: ['release/nov20-score-integrity-20261020']
    paths: ['.github/workflows/docker-volume-restore-test.yml']
permissions:
  contents: read
jobs:
  restore-test:
    if: github.ref == 'refs/heads/release/nov20-score-integrity-20261020'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    env:
      DOCKER_CONTEXT: colima
    steps:
      - name: Boot restored sample copies in temporary memory storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          cleanup() { docker rm -f "elleng-restore-$GITHUB_RUN_ID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {execFileSync}=require('node:child_process');
          const dir="/Users/blaineguy/elleng-docker-volume-backups/review-39704717436";
          const archive=path.join(dir,'postgres16-unattached-volumes.tar.gz');
          const manifest=JSON.parse(fs.readFileSync(path.join(dir,'manifest.json'),'utf8'));
          const expected="6e533869a96bef39e052450834d0decf90456c0a6d697fc3f52be34c926e3812";
          if(manifest.sha256!==expected||manifest.volumes.length!==135)throw Error('Backup manifest mismatch');
          async function main(){
           const hash=crypto.createHash('sha256');for await(const chunk of fs.createReadStream(archive))hash.update(chunk);
           if(hash.digest('hex')!==expected)throw Error('Backup checksum mismatch');
           const selected=[manifest.volumes[0].name,manifest.volumes[67].name,manifest.volumes[134].name];
           const output=execFileSync('docker',['run','--rm','--pull','never','--name','elleng-restore-'+process.env.GITHUB_RUN_ID,'-i','--network','none','--read-only','--memory','768m','--cpus','1','--tmpfs','/restore:rw,size=512m,mode=0700','--tmpfs','/tmp:rw,size=32m,mode=1777','--tmpfs','/var/lib/postgresql/data:rw,size=1m','--mount','type=bind,source='+archive+',target=/backup/archive.tar.gz,readonly','--entrypoint','bash','postgres:16','-s','--',...selected],{input:"set -euo pipefail\nmembers=()\nfor volume in \"$@\"; do members+=(\"$volume/_data\"); done\ntar -xzf /backup/archive.tar.gz -C /restore \"${members[@]}\"\nchown -R postgres:postgres /restore\nfor volume in \"$@\"; do\n  data=\"/restore/$volume/_data\"\n  chown -R postgres:postgres \"$data\"\n  chmod 700 \"$data\"\n  # Remove only the stale PID file in the temporary restored copy.\n  rm -f \"$data/postmaster.pid\"\n  rm -f /tmp/restore-admin.txt\n  printf \"COPY (SELECT rolname FROM pg_authid WHERE oid=10) TO '/tmp/restore-admin.txt';\\\\n\" | gosu postgres postgres --single -D \"$data\" -c shared_preload_libraries='' postgres > /tmp/restore-offline.log 2>&1\n  admin=\"$(cat /tmp/restore-admin.txt)\"\n  [ -n \"$admin\" ] || { echo \"Restored bootstrap administrator not found\"; exit 1; }\n  printf 'local all all trust\\n' > /tmp/restore-hba.conf\n  gosu postgres pg_ctl -D \"$data\" -o \"-c listen_addresses='' -c unix_socket_directories='/tmp' -c hba_file='/tmp/restore-hba.conf' -c shared_preload_libraries='' -c shared_buffers=32MB -c max_connections=10\" -l /tmp/restore-server.log -w -t 90 start >/dev/null\n  databases=\"$(gosu postgres psql -h /tmp -U \"$admin\" -d postgres -Atqc 'SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate')\"\n  count=0\n  while IFS= read -r database; do\n    [ -n \"$database\" ] || continue\n    gosu postgres psql -h /tmp -U \"$admin\" -d \"$database\" -v ON_ERROR_STOP=1 -Atqc \"SELECT count(*) FROM pg_class WHERE relkind IN ('r','p') AND relnamespace NOT IN (SELECT oid FROM pg_namespace WHERE nspname LIKE 'pg_%' OR nspname='information_schema')\" >/dev/null\n    count=$((count+1))\n  done <<< \"$databases\"\n  gosu postgres pg_ctl -D \"$data\" -m fast -w stop >/dev/null\n  printf 'RESTORE_SAMPLE_PASS %s databases=%s\\n' \"$volume\" \"$count\"\ndone\n",encoding:'utf8',timeout:600000,maxBuffer:8*1024*1024});
           console.log(output);
           const passed=output.split('\n').filter(l=>l.startsWith('RESTORE_SAMPLE_PASS '));
           if(passed.length!==3)throw Error('Expected all three sample restores to pass');
           const report={checked_at:new Date().toISOString(),archive_sha256:expected,samples:selected,passed:3,total_archived_volumes:135,scope:'Three sample clusters started and database catalogs queried; remaining clusters not boot-tested. Originals retained.'};
           fs.writeFileSync(path.join(dir,'restore-test-'+process.env.GITHUB_RUN_ID+'.json'),JSON.stringify(report,null,2),{mode:0o600,flag:'wx'});
           const docker=(...args)=>execFileSync('docker',args,{encoding:'utf8',maxBuffer:8*1024*1024});
           const active=JSON.parse(docker('inspect','fairwayos-pg-1-1'))[0];
           console.log('RESTORE_VERIFIED '+JSON.stringify({passed:3,total:135,backup:dir,fairwayos_running:active.State.Running,fairwayos_started:active.State.StartedAt}));
          }
          main().catch(e=>{console.error(e.message);process.exitCode=1});
          
          NODE
