name: Future golfer registration PostgreSQL integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/*independent_golfer_directory.sql'
      - 'supabase/migrations/*future_event_enrollments.sql'
      - 'supabase/tests/*directory*.sql'
      - 'supabase/tests/future_event_enrollment_isolation.sql'
      - 'supabase/tests/future_golfer_rpc_authorization.sql'
      - '.github/workflows/future-golfer-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elleng_future_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply migrations and rollback-only isolation tests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          export PGHOST=localhost PGUSER=postgres PGDATABASE=elleng_future_test
          psql -v ON_ERROR_STOP=1 -f supabase/tests/disposable_directory_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000000_independent_golfer_directory.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000001_future_event_enrollments.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/independent_golfer_directory_isolation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/future_event_enrollment_isolation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/future_golfer_rpc_authorization.sql
