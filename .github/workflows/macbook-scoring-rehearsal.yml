name: MacBook isolated scoring rehearsal
on:
  push:
    branches: ['development/nov20-release-reconciliation-20261026']
    paths:
      - '.github/workflows/macbook-scoring-rehearsal.yml'
      - 'tests/visual/**'
      - 'tests/nov20-production-score-integrity.test.cjs'
      - 'tests/alternate-scoring-validation.test.cjs'
      - 'scoring.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elleng-mac-scoring-rehearsal
  cancel-in-progress: true
jobs:
  isolated-macbook-scoring:
    if: github.repository == 'blaineg04/EllenG-Cup' && github.ref == 'refs/heads/development/nov20-release-reconciliation-20261026'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated runner and Node
        run: |
          node --version
          uname -s
          test "$(uname -s)" = Darwin
      - name: Run scoring and visual safety contracts
        run: node --test tests/nov20-production-score-integrity.test.cjs tests/alternate-scoring-validation.test.cjs tests/visual/safety.test.cjs
      - name: Install pinned Playwright dependencies
        run: npm ci --prefix tests/visual --ignore-scripts --no-audit --no-fund
      - name: Install Chromium without Docker
        run: tests/visual/node_modules/.bin/playwright install chromium
      - name: Run local-only isolated seven-width browser rehearsal
        env:
          CI: 'true'
        run: node tests/visual/run.cjs
      - name: Save isolated browser rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elleng-macbook-isolated-scoring-${{ github.sha }}
          path: visual-results/
          retention-days: 2
          if-no-files-found: warn
