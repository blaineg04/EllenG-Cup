name: EllenG scoring branch reconciliation checks
on:
  push:
    branches: ['development/nov20-release-reconciliation-20261026']
    paths:
      - 'tests/**'
      - 'scoring.html'
      - 'admin.html'
      - 'captain.html'
      - 'common.js'
      - '.github/workflows/elleng-reconciliation-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-release-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve existing scoring and Shamble format
        run: |
          node --test tests/nov20-production-score-integrity.test.cjs tests/shamble-format-characterization.test.cjs
  incoming-scoring-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify incoming individual-scoring requirements (must pass before integration)
        run: node --test tests/scoring-branch-compatibility.test.cjs
