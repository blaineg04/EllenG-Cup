name: MacBook restore dependency diagnosis
on:
  push:
    branches: ['development/nov20-release-reconciliation-20261026']
    paths: ['.github/workflows/macbook-private-application-restore.yml']
permissions:
  contents: read
jobs:
  diagnose-private-restore:
    if: github.repository == 'blaineg04/EllenG-Cup'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 3
    steps:
      - name: Report catalog dependency without exposing records
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const dirs=fs.readdirSync(process.env.HOME).filter(n=>n.startsWith('elleng-private-restore-')).map(n=>path.join(process.env.HOME,n)).filter(p=>fs.lstatSync(p).isDirectory()&&!fs.lstatSync(p).isSymbolicLink()).sort((a,b)=>fs.statSync(b).mtimeMs-fs.statSync(a).mtimeMs);
          const root=dirs.find(p=>fs.existsSync(path.join(p,'psql.log')));
          if(!root)throw Error('Private restore log unavailable');
          const log=fs.readFileSync(path.join(root,'psql.log'),'utf8');
          const relation=log.match(/relation "([a-zA-Z0-9_.]+)" does not exist/)?.[1]||null;
          const line=log.match(/application-without-vault.sql:(\d+):/)?.[1]||null;
          const sql=fs.readFileSync(path.join(root,'application-without-vault.sql'),'utf8').split('\n');
          const n=line?Number(line):0;
          const nearby=sql.slice(Math.max(0,n-12),n);
          const command=nearby.reverse().find(l=>/^(ALTER|CREATE|GRANT|REVOKE|COPY|COMMENT|SELECT|SET)\b/.test(l))?.match(/^[A-Z]+/)?.[0]||null;
          console.log('RESTORE_DEPENDENCY '+JSON.stringify({missing_relation:relation,statement_line:n,statement_type:command,raw_log_disclosed:false,restore_retried:false,production_changed:false}));
          NODE
