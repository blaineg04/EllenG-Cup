name: MacBook private application restore
on:
  push:
    branches: ['development/nov20-release-reconciliation-20261026']
    paths: ['.github/workflows/macbook-private-application-restore.yml']
permissions:
  contents: read
concurrency:
  group: elleng-private-application-restore
  cancel-in-progress: false
jobs:
  application-restore:
    if: github.repository == 'blaineg04/EllenG-Cup'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a090d2d8c5fbb2d4d3963b7ee3bd9bec22acad7e
          persist-credentials: false
      - name: Restore fingerprinted backup in private native cluster
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {spawnSync}=require('node:child_process');
          const bin='/Applications/Postgres.app/Contents/Versions/18/bin';
          const source=path.join(process.env.HOME,'elleng-backup-20261029_153839.sql');
          const expected='e82e5ee20d37afb4839ef3f911f490c243f89e5620f2f4cc4b59c77a344fc5ef';
          const bytes=fs.readFileSync(source);
          if(crypto.createHash('sha256').update(bytes).digest('hex')!==expected)throw Error('Backup fingerprint changed');
          const root=fs.mkdtempSync(path.join(process.env.HOME,'elleng-private-restore-'));
          fs.chmodSync(root,0o700);
          const socket=fs.mkdtempSync('/tmp/elleng-restore-');fs.chmodSync(socket,0o700);
          const data=path.join(root,'data');
          const env={...process.env,PGHOST:socket,PGPORT:'55439',PGUSER:'postgres',PGDATABASE:'postgres',PGSSLMODE:'disable',PGCONNECT_TIMEOUT:'10'};
          delete env.PGPASSWORD;delete env.PGSERVICE;delete env.PGSERVICEFILE;delete env.PGOPTIONS;
          let started=false;
          function run(tool,args,input){
           const log=fs.openSync(path.join(root,tool+'.log'),'w',0o600);
           const r=spawnSync(path.join(bin,tool),args,{env,input,stdio:[input===undefined?'ignore':'pipe',log,log],timeout:180000});
           fs.closeSync(log);
           if(r.status!==0){const text=fs.readFileSync(path.join(root,tool+'.log'),'utf8');const kinds=[['duplicate_schema',/schema "[a-z_]+" already exists/],['missing_role',/role "[a-z_]+" does not exist/],['missing_extension',/extension "[a-z_]+" is not available/],['permission_denied',/permission denied/],['missing_relation',/relation "[a-z_.]+" does not exist/],['missing_function',/function .* does not exist/],['missing_schema',/schema .* does not exist/],['vault_reference',/vault/],['library_load',/could not (access|load).*library/]];console.log('RESTORE_DIAGNOSTIC '+JSON.stringify({category:kinds.find(x=>x[1].test(text))?.[0]||'unclassified',sqlstate:text.match(/ERROR:\\s+([0-9A-Z]{5})\\b/)?.[1]||null}));console.log('RESTORE_BLOCKED '+JSON.stringify({tool,exit:r.status,private_logs:true}));throw Error('Private restore step failed; SQL and records not printed');}
          }
          try{
           run('initdb',['-D',data,'-U','postgres','--auth-local=trust','--auth-host=reject']);
           run('pg_ctl',['-D',data,'-l',path.join(root,'server.log'),'-o',"-c listen_addresses='' -c unix_socket_directories='"+socket+"' -p 55439",'-w','start']);started=true;
           const roles=['anon','authenticated','authenticator','dashboard_user','service_role','supabase_admin','supabase_auth_admin','supabase_etl_admin','supabase_privileged_role','supabase_read_only_user','supabase_realtime_admin','supabase_replication_admin','supabase_storage_admin'];
           run('psql',['-X','-v','ON_ERROR_STOP=1','-c',roles.map(x=>'CREATE ROLE "'+x+'" NOLOGIN;').join('\n')]);
           // Hosted catalog confirms supabase_admin is SUPERUSER; event-trigger ownership requires it.
          // This applies only to the private socket-only restore cluster.
          run('psql',['-X','-v','ON_ERROR_STOP=1','-c','ALTER ROLE supabase_admin SUPERUSER;']);
          const blocks=bytes.toString('utf8').split(/(?=^--\n-- (?:Data for )?Name: )/m);
           let omitted=0;
           const kept=blocks.filter(block=>{
            const header=block.split('\n').slice(0,4).join('\n');
            const vault=/Schema: vault;/.test(header)||/Name: (?:EXTENSION )?supabase_vault;/.test(header);
            if(vault)omitted++;
            return !vault;
           });
           if(!omitted)throw Error('Vault sections not recognized; refusing to modify derived copy');
           const derived=path.join(root,'application-without-vault.sql');
           fs.writeFileSync(derived,kept.join(''),{mode:0o600});
           // pg_dump omits cluster roles. Create only missing NOLOGIN placeholders
          // inside this new, socket-only cluster; never modify hosted roles.
          let restored=false;
          for(let attempt=0;attempt<16;attempt++){
           try{
            run('psql',['-X','-v','ON_ERROR_STOP=1','--single-transaction','-f',derived]);
            restored=true;break;
           }catch(error){
            const log=fs.readFileSync(path.join(root,'psql.log'),'utf8');
            const names=[...log.matchAll(/role "([a-z_][a-z0-9_]*)" does not exist/g)];
            const missing=names.at(-1)?.[1];
            if(!missing)throw error;
            const exists=spawnSync(path.join(bin,'psql'),['-X','-At','-c',"SELECT count(*) FROM pg_roles WHERE rolname='"+missing+"';"],{env,encoding:'utf8',timeout:10000});
            if(exists.status!==0||exists.stdout.trim()!=='0')throw error;
            run('psql',['-X','-v','ON_ERROR_STOP=1','-c','CREATE ROLE "'+missing+'" NOLOGIN;']);
            console.log('LOCAL_ROLE_PLACEHOLDER_CREATED');
           }
          }
          if(!restored)throw Error('Role dependency limit reached');
           // Scope checks deliberately do not claim hosted role equivalence or full recovery.
           const result=spawnSync(path.join(bin,'psql'),['-X','-At','-v','ON_ERROR_STOP=1','-c',"SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('elleng_team_scores','elleng_pair_hole_scores','elleng_player_hole_scores','elleng_tournaments','elleng_drafts');"],{env,encoding:'utf8',timeout:10000});
           if(result.status!==0||result.stdout.trim()!=='5')throw Error('Restored scoring table set incomplete');
           // Pin the exact reviewed source; all database commands still use the private socket.
          const beforeDump=path.join(root,'before-scoring-install.dump');
          run('pg_dump',['-Fc','-f',beforeDump]);
          const generate=spawnSync(process.execPath,['scripts/build-scoring-migration-review.cjs','--coordinated-review','--disposable-install'],{env:{...env,ELLENG_DISPOSABLE_PG_TEST:'I_UNDERSTAND_ISOLATED_ONLY'},encoding:'utf8',timeout:10000,maxBuffer:2*1024*1024});
          if(generate.status!==0)throw Error('Pinned disposable migration generation failed');
          const migration=path.join(root,'disposable-scoring-install.sql');
          fs.writeFileSync(migration,generate.stdout,{mode:0o600});
          const catalogQuery="SELECT jsonb_build_object('constraints',(SELECT jsonb_agg(jsonb_build_array(c.relname,k.conname,pg_get_constraintdef(k.oid)) ORDER BY c.relname,k.conname) FROM pg_constraint k JOIN pg_class c ON c.oid=k.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname LIKE 'elleng_%'),'policies',(SELECT jsonb_agg(to_jsonb(p) ORDER BY tablename,policyname) FROM pg_policies p WHERE schemaname='public' AND tablename LIKE 'elleng_%'),'triggers',(SELECT jsonb_agg(pg_get_triggerdef(t.oid) ORDER BY c.relname,t.tgname) FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname LIKE 'elleng_%' AND NOT t.tgisinternal),'table_acl',(SELECT jsonb_agg(jsonb_build_array(c.relname,c.relacl::text,c.relrowsecurity) ORDER BY c.relname) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' AND c.relname LIKE 'elleng_%'))::text;";
          function query(sql,database='postgres'){
           const r=spawnSync(path.join(bin,'psql'),['-X','-At','-v','ON_ERROR_STOP=1','-d',database,'-c',sql],{env,encoding:'utf8',timeout:30000,maxBuffer:4*1024*1024});
           if(r.status!==0)throw Error('Private catalog verification failed');
           return r.stdout.trim();
          }
          const baseline=query(catalogQuery);
          const scoreQuery="SELECT jsonb_build_object('team',(SELECT coalesce(jsonb_agg(to_jsonb(s) ORDER BY tournament_id,team_index,hole),'[]'::jsonb) FROM public.elleng_team_scores s),'pair',(SELECT coalesce(jsonb_agg(to_jsonb(s) ORDER BY tournament_id,team_index,hole,pair_index),'[]'::jsonb) FROM public.elleng_pair_hole_scores s),'player',(SELECT coalesce(jsonb_agg(to_jsonb(s) ORDER BY tournament_id,team_index,hole,golfer_index),'[]'::jsonb) FROM public.elleng_player_hole_scores s))::text;";
          const scoresBefore=query(scoreQuery);
          run('psql',['-X','-v','ON_ERROR_STOP=1','-f',migration]);
          const rpcCount=query("SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname IN ('elleng_test_authorized_scramble','elleng_test_authorized_shamble','elleng_test_authorized_split_pair','elleng_test_commissioner_clear_scores');");
          if(rpcCount!=='4')throw Error('Four scoring RPCs not installed');
          const writeCount=query("SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('elleng_team_scores','elleng_pair_hole_scores','elleng_player_hole_scores') AND (has_table_privilege('anon',c.oid,'INSERT,UPDATE,DELETE') OR has_table_privilege('authenticated',c.oid,'INSERT,UPDATE,DELETE'));");
          if(writeCount!=='0')throw Error('Direct API scoring writes still available');
          if(query(scoreQuery)!==scoresBefore)throw Error('Migration changed existing score records');
          console.log('PINNED_MIGRATION_INSTALL_PASS '+JSON.stringify({source:'a090d2d8c5fbb2d4d3963b7ee3bd9bec22acad7e',rpc_count:4,direct_api_write_tables:0,existing_scores_preserved:true,production_changed:false}));
          const reversal=path.join(root,'scoring-reversal.sql');
          fs.writeFileSync(reversal,"-- Candidate reversal for scoring source a090d2d8. Test locally before hosted use.\n-- Requires frozen scoring and fresh comparison with the captured schema.\nBEGIN;\nLOCK TABLE public.elleng_drafts, public.elleng_tournaments, public.elleng_team_scores, public.elleng_pair_hole_scores, public.elleng_player_hole_scores IN ACCESS EXCLUSIVE MODE;\nDO $guard$ BEGIN IF EXISTS(SELECT 1 FROM public.elleng_team_scores WHERE score>20) THEN RAISE EXCEPTION 'ROLLBACK_BLOCKED: preserve scores above 20 and retain migrated schema; do not delete or truncate records'; END IF; END $guard$;\nDROP TRIGGER \"elleng_lock_team_parent\" ON public.\"elleng_team_scores\";\nDROP TRIGGER \"elleng_lock_pair_parent\" ON public.\"elleng_pair_hole_scores\";\nDROP TRIGGER \"elleng_lock_player_parent\" ON public.\"elleng_player_hole_scores\";\nDROP TRIGGER \"elleng_enforce_team_score_format\" ON public.\"elleng_team_scores\";\nDROP TRIGGER \"elleng_prevent_scored_draft_format_change\" ON public.\"elleng_drafts\";\nDROP TRIGGER \"elleng_guard_scored_tournament_config\" ON public.\"elleng_tournaments\";\nDROP FUNCTION public.elleng_test_authorized_scramble(text,integer,integer,integer);\nDROP FUNCTION public.elleng_test_authorized_shamble(text,integer,integer,integer,integer);\nDROP FUNCTION public.elleng_test_authorized_split_pair(text,integer,integer,integer,integer);\nDROP FUNCTION public.elleng_test_commissioner_clear_scores(text);\nDROP FUNCTION public.elleng_lock_parent_for_score_write();\nDROP FUNCTION public.elleng_enforce_team_score_format();\nDROP FUNCTION public.elleng_prevent_scored_draft_format_change();\nDROP FUNCTION public.elleng_guard_scored_tournament_config();\nALTER TABLE public.elleng_team_scores DROP CONSTRAINT elleng_team_scores_score_check;\nALTER TABLE public.elleng_team_scores ADD CONSTRAINT elleng_team_scores_score_check CHECK (((score >= 1) AND (score <= 20)));\nDO $policies$ DECLARE p record; BEGIN FOR p IN SELECT tablename,policyname FROM pg_policies WHERE schemaname='public' AND tablename IN ('elleng_team_scores','elleng_pair_hole_scores','elleng_player_hole_scores') LOOP EXECUTE format('DROP POLICY %I ON public.%I',p.policyname,p.tablename); END LOOP; END $policies$;\nCREATE POLICY \"pair_authenticated_read\" ON public.\"elleng_pair_hole_scores\" AS PERMISSIVE FOR SELECT TO \"authenticated\" USING (true);\nCREATE POLICY \"pair_team_insert\" ON public.\"elleng_pair_hole_scores\" AS PERMISSIVE FOR INSERT TO \"authenticated\" WITH CHECK (((EXISTS ( SELECT 1\n   FROM (elleng_tournaments t\n     JOIN elleng_drafts d ON ((d.id = t.draft_id)))\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (d.owner_id = auth.uid())))) OR (EXISTS ( SELECT 1\n   FROM (elleng_tournaments t\n     JOIN elleng_captains c ON ((c.draft_id = t.draft_id)))\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (c.user_id = auth.uid()) AND (c.team_index = elleng_pair_hole_scores.team_index))))));\nCREATE POLICY \"pair_team_update\" ON public.\"elleng_pair_hole_scores\" AS PERMISSIVE FOR UPDATE TO \"authenticated\" USING (((EXISTS ( SELECT 1\n   FROM (elleng_tournaments t\n     JOIN elleng_drafts d ON ((d.id = t.draft_id)))\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (d.owner_id = auth.uid())))) OR (EXISTS ( SELECT 1\n   FROM (elleng_tournaments t\n     JOIN elleng_captains c ON ((c.draft_id = t.draft_id)))\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (c.user_id = auth.uid()) AND (c.team_index = elleng_pair_hole_scores.team_index)))))) WITH CHECK (((EXISTS ( SELECT 1\n   FROM (elleng_tournaments t\n     JOIN elleng_drafts d ON ((d.id = t.draft_id)))\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (d.owner_id = auth.uid())))) OR (EXISTS ( SELECT 1\n   FROM (elleng_tournaments t\n     JOIN elleng_captains c ON ((c.draft_id = t.draft_id)))\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (c.user_id = auth.uid()) AND (c.team_index = elleng_pair_hole_scores.team_index))))));\nCREATE POLICY \"pair_team_delete\" ON public.\"elleng_pair_hole_scores\" AS PERMISSIVE FOR DELETE TO \"authenticated\" USING (((EXISTS ( SELECT 1\n   FROM (elleng_tournaments t\n     JOIN elleng_drafts d ON ((d.id = t.draft_id)))\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (d.owner_id = auth.uid())))) OR (EXISTS ( SELECT 1\n   FROM (elleng_tournaments t\n     JOIN elleng_captains c ON ((c.draft_id = t.draft_id)))\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (c.user_id = auth.uid()) AND (c.team_index = elleng_pair_hole_scores.team_index))))));\nCREATE POLICY \"active live pair scores insert guard\" ON public.\"elleng_pair_hole_scores\" AS RESTRICTIVE FOR INSERT TO \"authenticated\" WITH CHECK ((EXISTS ( SELECT 1\n   FROM elleng_tournaments t\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (elleng_pair_hole_scores.team_index >= 0) AND (elleng_pair_hole_scores.team_index < t.team_count) AND (t.status = ANY (ARRAY['setup'::text, 'live'::text]))))));\nCREATE POLICY \"active live pair scores update guard\" ON public.\"elleng_pair_hole_scores\" AS RESTRICTIVE FOR UPDATE TO \"authenticated\" USING ((EXISTS ( SELECT 1\n   FROM elleng_tournaments t\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (elleng_pair_hole_scores.team_index >= 0) AND (elleng_pair_hole_scores.team_index < t.team_count) AND (t.status = ANY (ARRAY['setup'::text, 'live'::text])))))) WITH CHECK ((EXISTS ( SELECT 1\n   FROM elleng_tournaments t\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (elleng_pair_hole_scores.team_index >= 0) AND (elleng_pair_hole_scores.team_index < t.team_count) AND (t.status = ANY (ARRAY['setup'::text, 'live'::text]))))));\nCREATE POLICY \"active live pair scores delete guard\" ON public.\"elleng_pair_hole_scores\" AS RESTRICTIVE FOR DELETE TO \"authenticated\" USING ((EXISTS ( SELECT 1\n   FROM elleng_tournaments t\n  WHERE ((t.id = elleng_pair_hole_scores.tournament_id) AND (elleng_pair_hole_scores.team_index >= 0) AND (elleng_pair_hole_scores.team_index < t.team_count) AND (t.status = ANY (ARRAY['setup'::text, 'live'::text]))))));\nGRANT INSERT,UPDATE,DELETE,TRUNCATE ON public.\"elleng_pair_hole_scores\" TO anon,authenticated;\nCREATE POLICY \"shamble_authenticated_read\" ON public.\"elleng_player_hole_scores\" AS PERMISSIVE FOR SELECT TO \"authenticated\" USING (true);\nCREATE POLICY \"shamble_team_insert\" ON public.\"elleng_player_hole_scores\" AS PERMISSIVE FOR INSERT TO \"authenticated\" WITH CHECK (((EXISTS ( SELECT 1\n   FROM elleng_drafts d\n  WHERE ((d.id = 'elleng-cup'::text) AND (d.owner_id = auth.uid())))) OR (EXISTS ( SELECT 1\n   FROM elleng_captains c\n  WHERE ((c.draft_id = 'elleng-cup'::text) AND (c.user_id = auth.uid()) AND (c.team_index = elleng_player_hole_scores.team_index))))));\nCREATE POLICY \"shamble_team_update\" ON public.\"elleng_player_hole_scores\" AS PERMISSIVE FOR UPDATE TO \"authenticated\" USING (((EXISTS ( SELECT 1\n   FROM elleng_drafts d\n  WHERE ((d.id = 'elleng-cup'::text) AND (d.owner_id = auth.uid())))) OR (EXISTS ( SELECT 1\n   FROM elleng_captains c\n  WHERE ((c.draft_id = 'elleng-cup'::text) AND (c.user_id = auth.uid()) AND (c.team_index = elleng_player_hole_scores.team_index)))))) WITH CHECK (((EXISTS ( SELECT 1\n   FROM elleng_drafts d\n  WHERE ((d.id = 'elleng-cup'::text) AND (d.owner_id = auth.uid())))) OR (EXISTS ( SELECT 1\n   FROM elleng_captains c\n  WHERE ((c.draft_id = 'elleng-cup'::text) AND (c.user_id = auth.uid()) AND (c.team_index = elleng_player_hole_scores.team_index))))));\nCREATE POLICY \"shamble_team_delete\" ON public.\"elleng_player_hole_scores\" AS PERMISSIVE FOR DELETE TO \"authenticated\" USING (((EXISTS ( SELECT 1\n   FROM elleng_drafts d\n  WHERE ((d.id = 'elleng-cup'::text) AND (d.owner_id = auth.uid())))) OR (EXISTS ( SELECT 1\n   FROM elleng_captains c\n  WHERE ((c.draft_id = 'elleng-cup'::text) AND (c.user_id = auth.uid()) AND (c.team_index = elleng_player_hole_scores.team_inde