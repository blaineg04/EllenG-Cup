name: Independent golfer real Auth integration
on:
  pull_request:
    paths:
      - 'supabase/functions/player-admin/**'
      - 'supabase/migrations/*directory*.sql'
      - '.github/workflows/directory-auth-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Supabase CLI from npm
        run: |
          npm install --prefix /tmp/elleng-cli supabase@2.54.11
          echo /tmp/elleng-cli/node_modules/.bin >> "$GITHUB_PATH"
      - name: Start disposable local Supabase
        run: |
          mkdir -p /tmp/elleng-auth
          cd /tmp/elleng-auth
          supabase init
          supabase start
          supabase status -o env > /tmp/elleng-local.env
      - name: Exercise real Auth and duplicate rejection
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/elleng-local.env
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          base = os.environ['API_URL']
          assert base.startswith(('http://127.0.0.1:', 'http://localhost:'))
          def call(path, body, key):
              req = urllib.request.Request(base+path, json.dumps(body).encode(), {'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e: return e.code,json.load(e)
          email='directorytest@players.ellengcup.app'
          original='IsolatedTestPassword123!'
          service=os.environ['SERVICE_ROLE_KEY']
          anon=os.environ['ANON_KEY']
          status,created=call('/auth/v1/admin/users',{'email':email,'password':original,'email_confirm':True},service)
          assert status in (200,201), status
          status,duplicate=call('/auth/v1/admin/users',{'email':email,'password':'DifferentPassword123!','email_confirm':True},service)
          assert status in (400,409,422), status
          status,session=call('/auth/v1/token?grant_type=password',{'email':email,'password':original},anon)
          assert status==200 and session['user']['id']==created['id']
          status,_=call('/auth/v1/token?grant_type=password',{'email':email,'password':'DifferentPassword123!'},anon)
          assert status==400
          print('Real local Auth: creation, duplicate rejection and original password verified.')
          PY
      - name: Exercise deployed player-admin handler against local Auth
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/elleng-local.env
          export API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL
          mkdir -p /tmp/elleng-auth/supabase/functions/player-admin
          cp supabase/functions/player-admin/index.ts /tmp/elleng-auth/supabase/functions/player-admin/
          export PGPASSWORD=postgres
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'create table public.elleng_drafts(id text primary key,owner_id uuid not null,state jsonb not null);'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000000_independent_golfer_directory.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000002_directory_self_read.sql
          (cd /tmp/elleng-auth && supabase functions serve player-admin --no-verify-jwt) >/tmp/elleng-edge.log 2>&1 &
          python - <<'PY'
          import os,json,urllib.request,urllib.error,time,subprocess
          base=os.environ['API_URL']
          assert base.startswith(('http://127.0.0.1:', 'http://localhost:'))
          anon=os.environ['ANON_KEY']; service=os.environ['SERVICE_ROLE_KEY']
          def call(path,body,key,token=None):
              req=urllib.request.Request(base+path,json.dumps(body).encode(),{'apikey':key,'Authorization':'Bearer '+(token or key),'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:return e.code,json.load(e)
          pw='IsolatedCommissioner123!'
          status,owner=call('/auth/v1/admin/users',{'email':'owner@example.test','password':pw,'email_confirm':True},service)
          assert status in (200,201)
          oid=owner['id']
          import uuid
          uuid.UUID(oid)
          subprocess.run(['psql',os.environ['DB_URL'],'-v','ON_ERROR_STOP=1','-c',f"insert into public.elleng_drafts values ('elleng-cup','{oid}','{{}}');"],check=True)
          status,session=call('/auth/v1/token?grant_type=password',{'email':'owner@example.test','password':pw},anon)
          assert status==200
          token=session['access_token']
          subprocess.run(['psql',os.environ['DB_URL'],'-v','ON_ERROR_STOP=1','-c',"NOTIFY pgrst, 'reload schema';"],check=True)
          for attempt in range(20):
              status,gid=call('/rest/v1/rpc/elleng_register_directory_golfer',{'p_name':'Isolated Golfer'},anon,token)
              if status!=404 or gid.get('code')!='PGRST202':break
              time.sleep(2)
          assert status==200,(status,gid)
          payload={'action':'create_directory_login','directory_id':gid,'username':'isolatednewgolfer','password':'IsolatedGolfer123!'}
          time.sleep(15)
          status,result=call('/functions/v1/player-admin',payload,anon,token)
          assert status==200,(status,result)
          status,player=call('/auth/v1/token?grant_type=password',{'email':'isolatednewgolfer@players.ellengcup.app','password':payload['password']},anon)
          assert status==200 and player['user']['id']==result['user_id']
          status,_=call('/functions/v1/player-admin',payload,anon,player['access_token'])
          assert status==403,status
          status,_=call('/functions/v1/player-admin',payload,anon,token)
          assert status==409,status
          print('Real player-admin registration, sign-in and authorization verified.')
          PY
      - name: Verify independent golfer mobile browser lifecycle
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/elleng-local.env
          export API_URL ANON_KEY
          npm install --prefix /tmp/elleng-browser playwright @supabase/supabase-js@2
          /tmp/elleng-browser/node_modules/.bin/playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/elleng-http.log 2>&1 &
          cat > /tmp/elleng-browser/test.cjs <<'JS'
          const { chromium, devices } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            assert.match(process.env.API_URL, /^http:\/\/(127\.0\.0\.1|localhost):/);
            const browser = await chromium.launch();
            try {
              const context = await browser.newContext({...devices['iPhone 13'], serviceWorkers:'block'});
              await context.route('**/*', async route => {
                const url = new URL(route.request().url());
                if (url.pathname.endsWith('/config.js')) return route.fulfill({contentType:'application/javascript',body:'window.ELLENG_CONFIG='+JSON.stringify({supabaseUrl:process.env.API_URL,supabaseAnonKey:process.env.ANON_KEY})});
                if (url.hostname === 'cdn.jsdelivr.net' && url.pathname.includes('supabase-js')) return route.fulfill({contentType:'application/javascript',path:require('node:path').join(__dirname,'node_modules/@supabase/supabase-js/dist/umd/supabase.js')});
                if (['127.0.0.1','localhost'].includes(url.hostname)) return route.continue();
                return route.abort();
              });
              // Isolate the commissioner UI from unrelated tournament rendering.
              // Auth, directory RPC, directory reads and login creation remain real.
              const admin = await browser.newContext({...devices['iPhone 13'], serviceWorkers:'block'});
              await admin.route('**/*', async route => {
                const url = new URL(route.request().url());
                if (url.pathname.endsWith('/scoring.html')) {
                  const html = require('node:fs').readFileSync(process.cwd()+'/scoring.html','utf8');
                  const anchor = 'async function enterApp(){';
                  assert.ok(html.includes(anchor));
                  const fixture = 'async function enterApp(){ if(user && user.email==="owner@example.test"){ isCommissioner=true; tournament={status:"completed"}; draftState={teams:[],golfers:[],picks:[]}; document.body.classList.remove("login-mode"); $("loginCard").classList.add("hidden"); $("app").classList.remove("hidden"); $("app").style.display="block"; let node=$("newGolferName"); while(node && node!==document.body){node.classList.remove("hidden");node.style.setProperty("display",node.tagName==="INPUT"?"block":"block","important");node.style.setProperty("visibility","visible","important");node=node.parentElement;} await refreshGolferDirectory(true); document.body.dataset.fixtureReady="true"; return; }';
                  return route.fulfill({contentType:'text/html',body:html.replace(anchor,fixture)});
                }
                if (url.pathname.endsWith('/config.js')) return route.fulfill({contentType:'application/javascript',body:'window.ELLENG_CONFIG='+JSON.stringify({supabaseUrl:process.env.API_URL,supabaseAnonKey:process.env.ANON_KEY})});
                if (url.hostname === 'cdn.jsdelivr.net' && url.pathname.includes('supabase-js')) return route.fulfill({contentType:'application/javascript',path:require('node:path').join(__dirname,'node_modules/@supabase/supabase-js/dist/umd/supabase.js')});
                if (['127.0.0.1','localhost'].includes(url.hostname)) return route.continue();
                return route.abort();
              });
              const ap = await admin.newPage();
              await ap.goto('http://127.0.0.1:8765/scoring.html');
              await ap.locator('#email').fill('owner@example.test');
              await ap.locator('#password').fill('IsolatedCommissioner123!');
              await ap.locator('#loginBtn').click();
              await ap.waitForFunction(() => document.body.dataset.fixtureReady === 'true').catch(async error => { console.error('Commissioner fixture initialization:', await ap.locator('#loginMsg').textContent()); throw error; });
              await ap.locator('#newGolferName').waitFor({state:'visible'});
              await ap.locator('#newGolferName').fill('Browser Registered Golfer');
              await ap.locator('#newGolferParticipation').selectOption('false');
              await ap.locator('#addGolferBtn').click();
              const row = ap.locator('#directoryGolferList li').filter({hasText:'Browser Registered Golfer'});
              await row.waitFor({state:'visible'});
              await row.getByPlaceholder('New username',{exact:true}).fill('browsernewgolfer');
              await row.getByPlaceholder('New password (8+ characters)',{exact:true}).fill('BrowserGolfer123!');
              await row.getByRole('button',{name:'Create Login'}).click();
              await row.filter({hasText:'Login linked'}).waitFor({state:'visible'});
              await admin.close();
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:8765/scoring.html');
              await page.locator('#email').fill('browsernewgolfer');
              await page.locator('#password').fill('BrowserGolfer123!');
              await page.locator('#loginBtn').click();
              await page.locator('#independentProfileCard').waitFor({state:'visible'});
              assert.equal(await page.locator('#independentProfileName').textContent(),'Browser Registered Golfer');
              assert.equal(await page.locator('#app').isVisible(),false);
              await page.reload();
              await page.locator('#independentProfileCard').waitFor({state:'visible'});
              await page.locator('#independentProfileSignOut').click();
              await page.locator('#independentProfileCard').waitFor({state:'hidden'});
              await page.reload();
              await page.locator('#loginCard').waitFor({state:'visible'});
              assert.equal(await page.locator('#independentProfileCard').isVisible(),false);
              console.log('Mobile sign-in, profile recognition, reload persistence and sign-out verified.');
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode=1; });
          JS
          node /tmp/elleng-browser/test.cjs
      - name: Stop disposable services
        if: always()
        run: if [ -d /tmp/elleng-auth ]; then cd /tmp/elleng-auth && supabase stop --no-backup; fi
