name: EllenG Nov 20 scoring regression
on:
  push:
    branches:
      - development/elleng-audit-20261013
    paths:
      - scoring.html
      - service-worker.js
      - index.html
      - tests/nov20-*.test.cjs
      - sql/nov20-final-team-score-visibility.sql
      - tests/sql/nov20-final-score-policy-disposable.sql
      - tests/scripts/nov20-final-policy-local-check.sh
      - tests/draft-logic.test.cjs
      - tests/draft-auto-integration-readiness.test.cjs
      - tests/local-draft-db-safety.test.cjs
      - tests/draft-local-integration.test.cjs
      - scripts/check-local-draft-db.cjs
      - docs/draft-auto-pick-*.md
      - common.js
      - two-team-points.js
      - two-team-points-preview.html
      - tests/sql/two-team-points-local-*.sql
      - tests/scripts/two-team-points-local-smoke.sh
      - tests/two-team-points.test.cjs
      - tests/two-team-points-preview.test.cjs
      - .github/workflows/nov20-score-regression.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elleng-nov20-scoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  score-regression:
    name: Node scoring source regressions
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for scoring tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Node.js
        run: node --version
      - name: Check local PostgreSQL tooling availability (no connections)
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo 'psql is installed'
            psql --version
          else
            echo 'psql is not installed; database integration remains disabled'
          fi
          if command -v postgres >/dev/null 2>&1; then
            echo 'postgres server executable is installed'
          else
            echo 'postgres server executable not found on PATH'
          fi
      - name: Run scoring regression tests
        run: node --test tests/nov20-*.test.cjs
      - name: Verify standalone scoring preview wiring
        run: node --test tests/two-team-points-preview.test.cjs
      - name: Run additive two-team points tests
        run: node --test tests/two-team-points.test.cjs
      - name: Run draft logic regression tests
        run: node --test tests/draft-logic.test.cjs

      - name: Run automatic-pick integration readiness checks
        run: node --test tests/draft-auto-integration-readiness.test.cjs
      - name: Run local draft database safety tests
        run: node --test tests/local-draft-db-safety.test.cjs
      - name: Verify optional local integration harness safely skips by default
        run: node --test tests/draft-local-integration.test.cjs

      - name: Run isolated final-score policy assertions when explicitly configured
        if: ${{ vars.ELLENG_ENABLE_FINAL_POLICY_DB_TESTS == '1' }}
        env:
          ELLENG_FINAL_POLICY_DB_URL: ${{ secrets.ELLENG_FINAL_POLICY_DB_URL }}
          ELLENG_ENABLE_FINAL_POLICY_DB_TESTS: '1'
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            echo "::error::psql is required for isolated policy assertions"
            exit 1
          fi
          bash tests/scripts/nov20-final-policy-local-check.sh

      - name: Run disposable local PostgreSQL scoring smoke test when explicitly configured
        if: ${{ vars.ELLENG_ENABLE_LOCAL_POINTS_DB_TESTS == '1' }}
        env:
          ELLENG_RUN_LOCAL_DB_TESTS: '1'
          ELLENG_LOCAL_DB_URL: ${{ secrets.ELLENG_LOCAL_POINTS_DB_URL }}
        run: bash tests/scripts/two-team-points-local-smoke.sh
