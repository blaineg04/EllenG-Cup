name: EllenG draft and scoring fairness
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'common.js'
      - 'weighted-draft.js'
      - 'captain-fairness.js'
      - 'fair-scoring.js'
      - 'shamble-points.js'
      - 'scoring.html'
      - 'tests/weighted-fairness-integration.test.js'
      - 'tests/captain-fairness.test.js'
      - 'tests/fair-scoring.test.js'
      - 'tests/shamble-fairness-integration.test.js'
      - '.github/workflows/fairness-pr.yml'
  workflow_dispatch:
jobs:
  fairness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run captain allocation, snake order, and actual shamble fairness tests
        run: node --test tests/captain-fairness.test.js tests/fair-scoring.test.js tests/shamble-fairness-integration.test.js tests/weighted-fairness-integration.test.js
