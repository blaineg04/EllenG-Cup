<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EllenG Cup Commissioner</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top"><img src="gator.jpeg"><div><h1>EllenG Cup — Commissioner</h1><div>Live Supabase Draft Control</div></div><div style="margin-left:auto" id="connection">CONNECTING</div></div>
<div class="wrap">
<div id="loginCard" class="card">
<h2>Commissioner Sign In</h2>
<p class="muted">Only the authenticated commissioner account can change the live draft.</p>
<div class="actions" style="justify-content:flex-start">
<input id="email" type="email" autocomplete="username" placeholder="Commissioner email" style="max-width:300px">
<input id="password" type="password" autocomplete="current-password" placeholder="Password" style="max-width:240px">
<button id="login" class="gold">Sign In</button>
</div><div id="authMsg" class="muted"></div></div>
<div id="adminApp" style="display:none"><div class="card"><div class="actions"><button id="setupBtn" class="alt">Setup</button><button id="undo" class="gold">Undo Pick</button><button id="pause" class="alt">Pause/Resume</button><button id="resetClock" class="alt">Reset Clock</button></div></div>
<section id="setup" class="card"><h2>Golfer & Team Setup</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Golfer</th><th>HCP</th><th>Band</th></tr></thead><tbody id="grows"></tbody></table></div><h3>Teams</h3><table><tbody id="trows"></tbody></table><div class="actions" style="margin-top:10px"><select id="dtype"><option value="snake">Snake Draft</option><option value="straight">Straight Draft</option></select><select id="tlen"><option>30</option><option>45</option><option selected>60</option><option>90</option><option>120</option></select><button id="saveSetup" class="gold">Save Setup & Go Live</button></div></section>
<section id="live" class="grid" style="display:none"><div class="card"><h2>Available Golfers</h2><div id="pool"></div></div><div class="card"><div class="bar"><div><strong id="onclock"></strong><div id="meta" class="muted"></div></div><div style="text-align:center"><div id="clock">1:00</div><div class="muted">Pick clock</div></div></div><div id="teams" class="teams"></div></div></section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
async function secureSave(){
 const {data:{user}}=await db.auth.getUser();
 if(!user) throw new Error("Commissioner sign-in required.");
 let {data:existing}=await db.from("elleng_drafts").select("owner_id").eq("id",cfg.draftId).maybeSingle();
 if(!existing){
   let {error}=await db.from("elleng_drafts").insert({id:cfg.draftId,owner_id:user.id,state:S,updated_at:new Date().toISOString()});
   if(error) throw error;
 } else {
   if(existing.owner_id!==user.id) throw new Error("This draft belongs to a different commissioner account.");
   let {error}=await db.from("elleng_drafts").update({state:S,updated_at:new Date().toISOString()}).eq("id",cfg.draftId);
   if(error) throw error;
 }
}
save=secureSave;

let liveMode=false,tick;
function setupRender(){document.getElementById("grows").innerHTML=S.golfers.map((g,i)=>`<tr><td>${i+1}</td><td><input data-n="${i}" value="${esc(g.name)}"></td><td><input data-h="${i}" type="number" step=".1" value="${esc(g.hcp)}"></td><td><select data-b="${i}">${bands.map(b=>`<option ${g.band===b?"selected":""}>${b}</option>`).join("")}</select></td></tr>`).join("");document.getElementById("trows").innerHTML=S.teams.map((t,i)=>`<tr><td>Team ${i+1}</td><td><input data-tn="${i}" value="${esc(t.name)}"></td><td><input data-tc="${i}" placeholder="Captain" value="${esc(t.captain)}"></td></tr>`).join("");document.getElementById("dtype").value=S.draftType;document.getElementById("tlen").value=S.timerLength}
function liveRender(){let done=S.picks.length>=24,t=order(S.picks.length);document.getElementById("onclock").textContent=done?"DRAFT COMPLETE":"ON THE CLOCK: "+S.teams[t].name;document.getElementById("meta").textContent=done?"All rosters complete":`Round ${Math.floor(S.picks.length/6)+1} • Pick ${S.picks.length+1}`;document.getElementById("pool").innerHTML=S.golfers.map((g,i)=>({...g,i})).filter(g=>g.name&&g.team==null).map(g=>`<div class="player"><strong>${esc(g.name)}</strong><span class="badge">${g.band}</span><span class="muted">${esc(g.hcp||"—")}</span><button data-p="${g.i}" ${canBand(t,g.band)?"":"disabled"}>${canBand(t,g.band)?"Draft":"Limit"}</button></div>`).join("");document.getElementById("teams").innerHTML=S.teams.map((tm,i)=>`<div class="team"><div class="teamhead"><strong>${esc(tm.name)}</strong><div class="muted" style="color:#ddd">${esc(tm.captain)}</div><div style="font-size:11px">${bands.map(b=>b+" "+tbc(i,b)).join(" • ")}</div></div><div class="roster">${Array.from({length:4},(_,j)=>{let g=S.golfers[tm.roster[j]];return g?`<div class="slot"><strong>${esc(g.name)}</strong> <span class="badge">${g.band}</span><div class="muted">HCP ${esc(g.hcp||"—")}</div></div>`:`<div class="slot muted">Open roster spot</div>`}).join("")}</div></div>`).join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>pick(+b.dataset.p));drawClock()}
function drawClock(){let x=remaining();document.getElementById("clock").textContent=Math.floor(x/60)+":"+String(x%60).padStart(2,"0");document.getElementById("clock").style.color=x<=10?"#9b2f2f":""}
async function pick(i){let t=order(S.picks.length),g=S.golfers[i];if(!g||g.team!=null||!canBand(t,g.band))return;g.team=t;S.teams[t].roster.push(i);S.picks.push({golfer:i,team:t});S.timerPaused=false;S.timerEndsAt=new Date(Date.now()+S.timerLength*1000).toISOString();await save();liveRender()}
document.getElementById("saveSetup").onclick=async()=>{document.querySelectorAll("[data-n]").forEach(x=>S.golfers[+x.dataset.n].name=x.value.trim());document.querySelectorAll("[data-h]").forEach(x=>S.golfers[+x.dataset.h].hcp=x.value);document.querySelectorAll("[data-b]").forEach(x=>S.golfers[+x.dataset.b].band=x.value);document.querySelectorAll("[data-tn]").forEach(x=>S.teams[+x.dataset.tn].name=x.value||"Team "+(+x.dataset.tn+1));document.querySelectorAll("[data-tc]").forEach(x=>S.teams[+x.dataset.tc].captain=x.value);S.draftType=document.getElementById("dtype").value;S.timerLength=+document.getElementById("tlen").value;S.timerPaused=false;S.timerEndsAt=new Date(Date.now()+S.timerLength*1000).toISOString();await save();liveMode=true;document.getElementById("setup").style.display="none";document.getElementById("live").style.display="grid";liveRender()};
document.getElementById("setupBtn").onclick=()=>{liveMode=false;document.getElementById("live").style.display="none";document.getElementById("setup").style.display="block";setupRender()};
document.getElementById("undo").onclick=async()=>{let p=S.picks.pop();if(!p)return;S.golfers[p.golfer].team=null;S.teams[p.team].roster=S.teams[p.team].roster.filter(x=>x!==p.golfer);S.timerPaused=false;S.timerEndsAt=new Date(Date.now()+S.timerLength*1000).toISOString();await save();if(liveMode)liveRender()};
document.getElementById("pause").onclick=async()=>{if(S.timerPaused){S.timerPaused=false;S.timerEndsAt=new Date(Date.now()+S.timerLength*1000).toISOString()}else{S.timerLength=remaining();S.timerPaused=true;S.timerEndsAt=null}await save();liveRender()};
document.getElementById("resetClock").onclick=async()=>{S.timerLength=+document.getElementById("tlen").value||60;S.timerPaused=false;S.timerEndsAt=new Date(Date.now()+S.timerLength*1000).toISOString();await save();liveRender()};
async function openAdmin(){
 const {data:{user}}=await db.auth.getUser();
 if(!user){document.getElementById("loginCard").style.display="block";document.getElementById("adminApp").style.display="none";return}
 document.getElementById("loginCard").style.display="none";document.getElementById("adminApp").style.display="block";
 let {data}=await db.from("elleng_drafts").select("state,owner_id").eq("id",cfg.draftId).maybeSingle();
 if(data){if(data.owner_id && data.owner_id!==user.id){alert("This draft is owned by another commissioner account.");return}S={...fresh(),...data.state}}
 setupRender();subscribe(()=>{if(liveMode)liveRender();else setupRender()});
 if(!tick)tick=setInterval(()=>{if(liveMode)drawClock()},500);
}
document.getElementById("login").onclick=async()=>{
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const msg=document.getElementById("authMsg");msg.textContent="Signing in…";
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent=error.message;return}
 msg.textContent="";await openAdmin();
};
(async()=>{try{await openAdmin()}catch(e){document.getElementById("authMsg").textContent=e.message}})();</script></body></html>
